<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro Atardecer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Caveat:wght@500;700&family=Work+Sans:wght@400;500&family=Neonderthaw&display=swap" rel="stylesheet">
<style>
  :root{
    --sun:#ff9a5a;
    --coral:#ff6f8e;
    --gold:#f6c667;
  }
  *{ box-sizing:border-box; }
  html,body{
    height:100%;
    margin:0;
    overflow:hidden;
    overscroll-behavior:none;
    background:#120a1c;
  }
  body{
    color:#fff3e4;
    font-family:"Work Sans", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }

  /* ---------- la escena limpia (lo que hay debajo del polvo) ---------- */
  .scene{
    position:fixed; inset:0; z-index:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    padding:24px;
    background:
      radial-gradient(120% 60% at 50% 0%, rgba(255,154,90,.42), transparent 60%),
      linear-gradient(180deg, #2c1a3b 0%, #1b0f28 55%, #120a1c 100%);
    overflow:hidden;
  }
  .stars{ position:absolute; inset:0; }
  .star{
    position:absolute; border-radius:50%;
    background:#fff6ea;
    animation:twinkle var(--d) ease-in-out var(--delay) infinite;
  }
  @keyframes twinkle{ 0%,100%{ opacity:.15; } 50%{ opacity:.95; } }

  .inner{ position:relative; max-width:520px; }
  .sun{
    width:min(46vw, 26vh, 200px);
    aspect-ratio:1;
    margin:0 auto 26px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffe3ad, var(--sun) 45%, var(--coral) 100%);
    box-shadow:0 0 70px 14px rgba(255,154,90,.5);
    animation:pulse 6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 70px 14px rgba(255,154,90,.5); }
    50%{ box-shadow:0 0 95px 22px rgba(255,154,90,.7); }
  }
  .eyebrow{
    font-family:"Caveat", cursive;
    font-size:1.7rem;
    color:var(--gold);
    margin:0 0 4px;
  }
  h1{
    font-family:"Fraunces", Georgia, serif;
    font-weight:600;
    font-size:clamp(2.2rem, 8vw, 3.6rem);
    line-height:1.08;
    letter-spacing:-.01em;
    margin:0;
    color:#fff6ea;
    text-wrap:balance;
  }
  .subtitle{
    margin:14px 0 0;
    font-size:1.05rem;
    color:#f3d9c4;
  }

  /* ---------- capas de limpieza ---------- */
  canvas{
    position:fixed; left:0; top:0;
    display:block;
  }
  #light{ z-index:1; mix-blend-mode:screen; pointer-events:none; }
  #dirt{
    z-index:2;
    touch-action:none;
    -webkit-touch-callout:none;
    cursor:grab;
  }
  #dirt.drawing{ cursor:grabbing; }

  /* luz que sigue al dedo / mouse mientras se limpia */
  #torch{
    position:fixed; left:0; top:0; z-index:4;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,222,165,.46) 0%, rgba(255,170,90,.16) 42%, rgba(255,170,90,0) 70%);
    mix-blend-mode:screen;
    pointer-events:none;
    opacity:0;
    transition:opacity .3s ease;
    will-change:transform;
  }
  #torch.on{ opacity:1; }

  /* al terminar de limpiar: el polvo se disuelve y un destello tibio llena la pantalla */
  #dirt.fade{ opacity:0; transition:opacity 1.4s ease; pointer-events:none; }
  .motes{ transition:opacity 1s ease; }
  .motes.fade{ opacity:0; }
  #flash{
    position:fixed; inset:0; z-index:8;
    pointer-events:none;
    opacity:0;
    background:radial-gradient(circle at 50% 42%, rgba(255,236,190,.96) 0%, rgba(255,190,110,.55) 38%, rgba(255,154,90,0) 72%);
  }
  #flash.go{ animation:flash 2.2s ease-in-out forwards; }
  @keyframes flash{
    0%{ opacity:0; transform:scale(.6); }
    45%{ opacity:1; transform:scale(1.15); }
    100%{ opacity:.95; transform:scale(1.6); }
  }

  /* motas de polvo flotando */
  .motes{ position:fixed; inset:0; z-index:3; pointer-events:none; overflow:hidden; }
  .mote{
    position:absolute; border-radius:50%;
    background:rgba(255,236,200,.8);
    filter:blur(.6px);
    opacity:0;
    animation:drift var(--d) ease-in-out var(--delay) infinite;
  }
  @keyframes drift{
    0%{ opacity:0; transform:translate(0,0); }
    20%,80%{ opacity:var(--o); }
    100%{ opacity:0; transform:translate(var(--dx), var(--dy)); }
  }

  #hint{
    position:fixed; left:0; right:0; z-index:6;
    bottom:max(30px, calc(env(safe-area-inset-bottom) + 22px));
    text-align:center;
    pointer-events:none;
    font-family:"Caveat", cursive;
    font-size:1.65rem;
    color:#f3d9c4;
    text-shadow:0 2px 14px rgba(0,0,0,.9);
    animation:hintPulse 2.6s ease-in-out infinite;
    transition:opacity .7s ease;
  }
  @keyframes hintPulse{ 0%,100%{ opacity:.5; } 50%{ opacity:1; } }
  #hint.gone{ opacity:0; animation:none; }

  /* ---------- abandono: viñeta oscura con luz que parpadea, araña colgando, foto vieja con polvo ---------- */
  #decay{
    position:fixed; inset:0; z-index:5; pointer-events:none;
    background:
      radial-gradient(120% 95% at 50% 46%, rgba(0,0,0,0) 38%, rgba(4,3,2,.72) 100%),
      radial-gradient(60% 40% at 0% 100%, rgba(18,26,14,.5), transparent 70%),
      radial-gradient(55% 38% at 100% 100%, rgba(18,26,14,.42), transparent 70%);
    animation:flick 7s steps(1,end) infinite;
    transition:opacity 1.2s ease;
  }
  #decay.fade{ opacity:0; animation:none; }
  @keyframes flick{
    0%,100%{ opacity:1; } 11%{ opacity:.78; } 12%{ opacity:1; } 13%{ opacity:.6; } 14%{ opacity:1; }
    47%{ opacity:.88; } 48%{ opacity:1; } 83%{ opacity:.7; } 84%{ opacity:1; } 85%{ opacity:.82; } 86%{ opacity:1; }
  }

  .spider{
    position:fixed; z-index:3; top:15vh; left:19vw; width:30px; height:30px;
    pointer-events:none; transform-origin:50% 0;
    animation:dangle 8s ease-in-out infinite;
    transition:opacity 1s ease, transform 1.4s ease;
  }
  .spider::before{ content:""; position:absolute; left:50%; bottom:100%; width:1px; height:130vh; margin-left:-.5px; background:rgba(226,228,234,.5); }
  .spider svg{ width:100%; height:100%; display:block; overflow:visible; }
  .spider.gone{ opacity:0; animation:none; transform:translateY(-60vh); }
  @keyframes dangle{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    45%{ transform:translateY(70px) rotate(5deg); }
    60%{ transform:translateY(66px) rotate(-3deg); }
  }

  .relic{
    position:fixed; z-index:3; right:5vw; bottom:13vh;
    width:clamp(120px, 25vmin, 215px);
    padding:8px 8px 24px;
    background:linear-gradient(160deg, #cbb98f, #a8946a);
    box-shadow:0 14px 30px rgba(0,0,0,.7), inset 0 0 22px rgba(70,50,20,.5);
    transform:rotate(7deg);
    pointer-events:none;
    opacity:0; transition:opacity 1.6s ease;
  }
  .relic.in{ opacity:.96; }
  .relic::before{                                 /* cinta vieja */
    content:""; position:absolute; top:-12px; left:50%; width:64px; height:22px; margin-left:-32px;
    background:rgba(216,196,140,.62); transform:rotate(-4deg);
    box-shadow:0 1px 3px rgba(0,0,0,.35);
  }
  .relic .ph{ position:relative; overflow:hidden; }
  .relic img{
    width:100%; aspect-ratio:3/4; object-fit:cover; display:block;
    filter:sepia(calc(.1 + .5 * var(--dust, 1))) contrast(calc(1 - .18 * var(--dust, 1))) brightness(calc(.98 - .36 * var(--dust, 1))) saturate(calc(1 - .3 * var(--dust, 1)));
    transition:filter .6s ease;
  }
  .relic .dust{                                   /* polvo encima: se va al limpiar esa zona */
    position:absolute; inset:0;
    opacity:var(--dust, 1);
    transition:opacity .5s ease;
    background:
      radial-gradient(circle at 28% 22%, rgba(150,138,118,.6), transparent 55%),
      radial-gradient(circle at 78% 72%, rgba(96,84,68,.7), transparent 58%),
      repeating-linear-gradient(35deg, rgba(210,200,180,.07) 0 2px, transparent 2px 7px),
      rgba(78,68,56,.55);
  }
  .relic.in.gone{ opacity:0; transition:opacity 1.4s ease; }

  /* ---------- el titulo es un letrero de neon malogrado, cubierto de polvo ---------- */
  .inner h1{ visibility:hidden; }                  /* el titulo de verdad lo hace el letrero (mismo lugar) */
  .neon{
    position:fixed; z-index:3; left:50%; top:30%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    opacity:0; transition:opacity 1.6s ease;
    --on:#fff1f4; --glow:var(--coral); --off:#6e4d5f;
  }
  .neon.in{ opacity:1; }
  .neon.in.gone{ opacity:0; transition:opacity 1.2s ease; }
  .neon .panel{
    position:relative; display:block; white-space:nowrap;
    padding:.12em .5em .2em;
    font-family:"Neonderthaw", "Caveat", cursive;
    font-size:clamp(2.1rem, 8.4vw, 3.5rem);
    line-height:1.12; letter-spacing:.02em; color:var(--on);
    background:linear-gradient(170deg, #1d121c, #0e0810);
    border:3px solid #2f1f2c; border-radius:14px;
    box-shadow:inset 0 0 28px rgba(0,0,0,.8), inset 0 2px 0 rgba(255,255,255,.05), 0 14px 30px rgba(0,0,0,.55);
    animation:signpower 9s steps(1,end) infinite;
    overflow:hidden;
  }
  .neon::before{                                    /* luz que tira sobre la pared */
    content:""; position:absolute; inset:-40% -14%; z-index:-1;
    background:radial-gradient(closest-side, rgba(255,111,142,.30), rgba(255,111,142,0) 72%);
    opacity:calc(1 - .75 * var(--dust, 1));
    animation:wallglow 9s steps(1,end) infinite;
  }
  .neon .panel::after{                              /* tornillos */
    content:""; position:absolute; inset:7px; pointer-events:none;
    background:
      radial-gradient(circle at 5px 5px, #6a5a62 0 2.2px, transparent 2.8px),
      radial-gradient(circle at calc(100% - 5px) 5px, #6a5a62 0 2.2px, transparent 2.8px),
      radial-gradient(circle at 5px calc(100% - 5px), #6a5a62 0 2.2px, transparent 2.8px),
      radial-gradient(circle at calc(100% - 5px) calc(100% - 5px), #6a5a62 0 2.2px, transparent 2.8px);
    background-repeat:no-repeat;
  }
  .neon .txt{ display:block; filter:brightness(calc(1 - .25 * var(--dust, 1))); transition:filter .6s ease; }
  .neon .nl{
    display:inline-block;
    color:var(--on);
    text-shadow:0 0 3px #fff, 0 0 9px #ffc2d0, 0 0 20px var(--glow), 0 0 40px var(--glow), 0 0 74px rgba(255,111,142,.65);
    animation:hum 3.1s ease-in-out infinite alternate;
  }
  .neon .nl.dead{ animation:tubedead 11s steps(1,end) infinite; }
  .neon .nl.fl{   animation:tubefl 2.6s steps(1,end) infinite; }
  .neon .nl.long{ animation:tubelong 8s steps(1,end) infinite; }
  .neon .nl.sp{   animation:tubesp 5.3s steps(1,end) infinite; }
  .neon .nl.fl2{  animation:tubefl 3.7s steps(1,end) -1.1s infinite; }
  @keyframes tubedead{
    0%,100%{ color:var(--off); text-shadow:0 1px 0 rgba(255,255,255,.07); }
    41%{ color:var(--on); text-shadow:0 0 3px #fff, 0 0 12px var(--glow), 0 0 28px var(--glow); }
    42%{ color:var(--off); text-shadow:0 1px 0 rgba(255,255,255,.07); }
    43%{ color:#a86a80; text-shadow:0 0 8px rgba(255,111,142,.5); }
    44%{ color:var(--off); text-shadow:0 1px 0 rgba(255,255,255,.07); }
    78%{ color:var(--on); text-shadow:0 0 3px #fff, 0 0 12px var(--glow), 0 0 28px var(--glow); }
    79%{ color:var(--off); text-shadow:0 1px 0 rgba(255,255,255,.07); }
  }
  @keyframes tubefl{
    0%,100%{ opacity:1; } 8%{ opacity:.25; } 10%{ opacity:1; } 15%{ opacity:.12; } 16%{ opacity:.9; }
    22%{ opacity:.2; } 60%{ opacity:1; } 63%{ opacity:.3; } 64%{ opacity:1; } 66%{ opacity:.15; } 68%{ opacity:1; }
  }
  @keyframes tubelong{
    0%,100%{ color:var(--on); }
    48%{ color:var(--off); text-shadow:0 1px 0 rgba(255,255,255,.07); }
    58%{ color:#c98aa0; text-shadow:0 0 8px rgba(255,111,142,.5); }
    60%{ color:var(--off); text-shadow:0 1px 0 rgba(255,255,255,.07); }
    66%{ color:var(--on); }
    68%{ color:var(--off); text-shadow:0 1px 0 rgba(255,255,255,.07); }
    71%{ color:var(--on); }
  }
  @keyframes tubesp{
    0%,100%{ opacity:1; } 30%{ opacity:.45; } 31%{ opacity:1; } 72%{ opacity:.3; } 73%{ opacity:.8; } 75%{ opacity:.2; } 77%{ opacity:1; }
  }
  @keyframes hum{ from{ opacity:.93; } to{ opacity:1; } }
  @keyframes signpower{
    0%,100%{ filter:none; }
    55%{ filter:brightness(.35); } 56%{ filter:none; } 57%{ filter:brightness(.55); } 58%{ filter:none; }
    90%{ filter:brightness(.25); } 91.5%{ filter:none; }
  }
  @keyframes wallglow{
    0%,100%{ opacity:1; } 55%{ opacity:.25; } 56%{ opacity:1; } 57%{ opacity:.45; } 58%{ opacity:1; } 90%{ opacity:.15; } 91.5%{ opacity:1; }
  }
  .neon .sdust{                                     /* polvo sobre el letrero: se va al limpiar */
    position:absolute; inset:0; pointer-events:none;
    opacity:var(--dust, 1); transition:opacity .5s ease;
    background:
      radial-gradient(circle at 20% 30%, rgba(150,138,118,.34), transparent 55%),
      radial-gradient(circle at 80% 75%, rgba(96,84,68,.4), transparent 58%),
      repeating-linear-gradient(35deg, rgba(210,200,180,.05) 0 2px, transparent 2px 8px),
      rgba(70,62,52,.14);
  }
  .neon .sweb{ position:absolute; width:34%; max-width:130px; aspect-ratio:1; pointer-events:none; opacity:calc(.95 * var(--dust, 1)); transition:opacity .5s ease; }
  .neon .sweb.tl{ left:0; top:0; }
  .neon .sweb.br{ right:0; bottom:0; transform:scale(-1,-1); }

  @media (prefers-reduced-motion: reduce){
    .sun, .star, .mote, #hint, #decay, .spider, .neon .panel, .neon::before, .neon .nl{ animation:none; }
    .neon .nl.dead{ color:var(--off); text-shadow:0 1px 0 rgba(255,255,255,.07); }
    #hint{ opacity:.9; }
  }
</style>
</head>
<body>

<main class="scene">
  <div class="stars" id="stars" aria-hidden="true"></div>
  <div class="inner">
    <div class="sun"></div>
    <p class="eyebrow">para ti</p>
    <h1>Nuestro Atardecer</h1>
    <p class="subtitle">una playlist hecha con todo mi cariño</p>
  </div>
</main>

<canvas id="light" aria-hidden="true"></canvas>
<canvas id="dirt" aria-hidden="true"></canvas>
<div class="relic" id="relic" aria-hidden="true">
  <div class="ph"><img src="media/fotos/fatguys.jpg" alt=""><div class="dust"></div></div>
</div>
<div class="neon" id="neon" aria-hidden="true">
  <div class="panel">
    <span class="txt" id="neon-txt"></span>
    <svg class="sweb tl" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#dfe1e8" stroke-width=".9" stroke-linecap="round" opacity=".7"><path d="M0 0L100 14M0 0L92 44M0 0L68 78M0 0L34 97M0 0L8 100"/><path d="M26 4Q24 20 6 26M50 8Q46 38 10 50M74 11Q66 56 16 74M96 14Q82 74 20 94"/></g></svg>
    <svg class="sweb br" viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="#dfe1e8" stroke-width=".9" stroke-linecap="round" opacity=".7"><path d="M0 0L100 14M0 0L92 44M0 0L68 78M0 0L34 97M0 0L8 100"/><path d="M26 4Q24 20 6 26M50 8Q46 38 10 50M74 11Q66 56 16 74M96 14Q82 74 20 94"/></g></svg>
    <div class="sdust"></div>
  </div>
</div>
<div class="spider" id="spider" aria-hidden="true">
  <svg viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
    <g stroke="#0c0a09" stroke-width="1.3" fill="none" stroke-linecap="round">
      <path d="M15 14 L5 8 L1 12"/><path d="M15 15 L4 14 L1 20"/><path d="M15 17 L5 21 L3 27"/><path d="M15 18 L8 26 L7 30"/>
      <path d="M15 14 L25 8 L29 12"/><path d="M15 15 L26 14 L29 20"/><path d="M15 17 L25 21 L27 27"/><path d="M15 18 L22 26 L23 30"/>
    </g>
    <ellipse cx="15" cy="19" rx="6" ry="7.5" fill="#15110f"/><circle cx="15" cy="11.5" r="3.6" fill="#1d1816"/>
    <circle cx="13.6" cy="10.8" r=".9" fill="#c9bfa8"/><circle cx="16.4" cy="10.8" r=".9" fill="#c9bfa8"/>
  </svg>
</div>
<div id="decay" aria-hidden="true"></div>
<div class="motes" id="motes" aria-hidden="true"></div>
<div id="torch" aria-hidden="true"></div>
<div id="flash" aria-hidden="true"></div>
<p id="hint">mantén presionado y desliza para limpiar</p>

<script>
(() => {
  const dirt  = document.getElementById("dirt");
  const light = document.getElementById("light");
  const torch = document.getElementById("torch");
  const hint  = document.getElementById("hint");
  const dctx  = dirt.getContext("2d");
  const lctx  = light.getContext("2d");

  let W, H, DPR, R;
  const strokes = [];          /* puntos limpiados, normalizados (0-1), para repintar si cambia el tamaño */
  const MAX_STROKE_VALUES = 80000;

  /* ---- progreso: una cuadricula de celdas; cada pasada marca las celdas que toca ---- */
  const DONE_AT = 0.85;        /* con 85% limpio se da por terminado (las esquinas exactas no hacen falta) */
  const CLEAN_FLAG = "gracias-dic-limpio";
  const relic = document.getElementById("relic");
  const neon = document.getElementById("neon");
  const dustEls = [relic, neon];          /* cosas que tienen polvo encima y se limpian al pasar el dedo */
  let dustCells = [];

  /* el titulo es un letrero de neon malogrado: cada letra es un tubo con su propio fallo */
  (function neonLetters(){
    const box = document.getElementById("neon-txt");
    const text = (document.querySelector(".inner h1") || {}).textContent || "Nuestro Atardecer";
    const kinds = ["", "dead", "fl", "", "long", "fl2", "sp"];
    [...text].forEach((ch, i) => {
      const s = document.createElement("span");
      s.className = "nl" + (kinds[i % kinds.length] ? " " + kinds[i % kinds.length] : "");
      s.textContent = ch === " " ? " " : ch;
      box.appendChild(s);
    });
  })();
  let cell, cols, rows, covered, coveredCount, totalCells;
  let finished = false;

  function initCoverage(){
    cell = Math.max(18, R * 0.45);
    cols = Math.ceil(W / cell);
    rows = Math.ceil(H / cell);
    totalCells = cols * rows;
    covered = new Uint8Array(totalCells);
    coveredCount = 0;
    /* celdas que caen sobre la foto vieja y el letrero: al limpiarlas se les va el polvo */
    placeSign();
    dustCells = dustEls.map((el) => {
      const list = [];
      const rr = el.getBoundingClientRect();
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const cx = (c + 0.5) * cell, cy = (r + 0.5) * cell;
        if (cx >= rr.left && cx <= rr.right && cy >= rr.top && cy <= rr.bottom) list.push(r * cols + c);
      }
      return list;
    });
  }

  /* el letrero se pone justo donde esta el titulo de la escena */
  function placeSign(){
    const h = document.querySelector(".inner h1");
    if (!h) return;
    const r = h.getBoundingClientRect();
    neon.style.left = (r.left + r.width / 2) + "px";
    neon.style.top = (r.top + r.height / 2) + "px";
  }

  function updateRelic(){
    dustEls.forEach((el, k) => {
      const list = dustCells[k];
      if (!list || !list.length) return;
      let n = 0;
      for (const i of list) if (covered[i]) n++;
      el.style.setProperty("--dust", Math.max(0, 1 - (n / list.length) * 1.3).toFixed(3));
    });
  }

  function markCoverage(x, y){
    const rad = R * 0.75;
    const c0 = Math.max(0, Math.floor((x - rad) / cell)), c1 = Math.min(cols - 1, Math.floor((x + rad) / cell));
    const r0 = Math.max(0, Math.floor((y - rad) / cell)), r1 = Math.min(rows - 1, Math.floor((y + rad) / cell));
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        const dx = (c + 0.5) * cell - x, dy = (r + 0.5) * cell - y;
        if (dx * dx + dy * dy <= rad * rad) {
          const i = r * cols + c;
          if (!covered[i]) { covered[i] = 1; coveredCount++; }
        }
      }
    }
  }

  /* generador pseudoaleatorio con semilla: la suciedad se ve igual cada vez */
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function sizeCanvases(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    for (const c of [dirt, light]) {
      c.width  = Math.round(W * DPR);
      c.height = Math.round(H * DPR);
      c.style.width  = W + "px";
      c.style.height = H + "px";
    }
    dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    lctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    R = Math.max(44, Math.min(W, H) * 0.1);
    torch.style.width = torch.style.height = (R * 3.6) + "px";
  }

  /* ---------- telaraña de esquina ---------- */
  function web(cx, cy, size, a0, a1, rng, alpha){
    const spokesN = 9, rings = 7;
    const spokes = [];
    for (let i = 0; i < spokesN; i++) {
      spokes.push({
        a: a0 + (a1 - a0) * i / (spokesN - 1) + (rng() - 0.5) * 0.07,
        len: size * (0.72 + rng() * 0.28)
      });
    }
    dctx.save();
    dctx.lineCap = "round";
    dctx.globalAlpha = alpha == null ? 1 : alpha;

    dctx.strokeStyle = "rgba(226,228,234,0.42)";
    dctx.lineWidth = 1.1;
    dctx.beginPath();
    for (const s of spokes) {
      dctx.moveTo(cx, cy);
      dctx.lineTo(cx + Math.cos(s.a) * s.len, cy + Math.sin(s.a) * s.len);
    }
    dctx.stroke();

    dctx.strokeStyle = "rgba(226,228,234,0.32)";
    dctx.lineWidth = 0.8;
    for (let k = 1; k <= rings; k++) {
      const t = k / rings;
      dctx.beginPath();
      for (let i = 0; i < spokesN - 1; i++) {
        const s0 = spokes[i], s1 = spokes[i + 1];
        const r0 = s0.len * t * (0.94 + rng() * 0.1);
        const r1 = s1.len * t * (0.94 + rng() * 0.1);
        if (i === 0) dctx.moveTo(cx + Math.cos(s0.a) * r0, cy + Math.sin(s0.a) * r0);
        const am = (s0.a + s1.a) / 2;
        const rm = ((r0 + r1) / 2) * 0.8;               /* la hebra cuelga hacia la esquina */
        dctx.quadraticCurveTo(
          cx + Math.cos(am) * rm, cy + Math.sin(am) * rm,
          cx + Math.cos(s1.a) * r1, cy + Math.sin(s1.a) * r1
        );
      }
      dctx.stroke();
    }
    dctx.restore();
  }

  /* ---------- capa de polvo, mugre y telarañas ---------- */
  function paintDirt(){
    const rng = mulberry32(20261204);
    dctx.globalCompositeOperation = "source-over";
    dctx.clearRect(0, 0, W, H);

    const base = dctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.15, W / 2, H / 2, Math.hypot(W, H) * 0.6);
    base.addColorStop(0, "rgba(44,38,32,0.94)");
    base.addColorStop(1, "rgba(7,6,5,0.985)");
    dctx.fillStyle = base;
    dctx.fillRect(0, 0, W, H);

    /* manchas de mugre */
    const blotches = Math.round(W * H / 5200);
    for (let i = 0; i < blotches; i++) {
      const x = rng() * W, y = rng() * H, r = 18 + rng() * 110;
      const a = 0.04 + rng() * 0.10;
      const tone = rng() < 0.55 ? "64,50,36" : (rng() < 0.5 ? "20,18,16" : "92,88,80");
      const g = dctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${tone},${a})`);
      g.addColorStop(1, `rgba(${tone},0)`);
      dctx.fillStyle = g;
      dctx.beginPath(); dctx.arc(x, y, r, 0, Math.PI * 2); dctx.fill();
    }

    /* chorreones de humedad */
    const streaks = Math.max(6, Math.round(W / 70));
    for (let i = 0; i < streaks; i++) {
      const x = rng() * W, len = H * (0.2 + rng() * 0.5), w = 6 + rng() * 26;
      const g = dctx.createLinearGradient(x, 0, x, len);
      g.addColorStop(0, "rgba(18,15,12,0.24)");
      g.addColorStop(1, "rgba(18,15,12,0)");
      dctx.fillStyle = g;
      dctx.fillRect(x - w / 2, 0, w, len);
    }

    /* motitas de polvo fino */
    const specks = Math.round(W * H / 320);
    for (let i = 0; i < specks; i++) {
      const x = rng() * W, y = rng() * H, s = 0.5 + rng() * 1.6;
      dctx.fillStyle = `rgba(${190 + rng() * 50 | 0},${185 + rng() * 45 | 0},${170 + rng() * 40 | 0},${0.05 + rng() * 0.22})`;
      dctx.fillRect(x, y, s, s);
    }

    /* telarañas en las esquinas */
    web(W * 0.5, 0, Math.min(W * 0.34, H * 0.4), 0.15, Math.PI - 0.15, rng, 0.8);    /* la del medio, arriba */
    web(0, 0, Math.min(W * 0.78, H * 0.72),  0,               Math.PI / 2,      rng, 1);
    web(W, 0, Math.min(W * 0.78, H * 0.72),  Math.PI / 2,     Math.PI,          rng, 1);
    web(0, H, Math.min(W * 0.6,  H * 0.42),  -Math.PI / 2,    0,                rng, 0.95);
    web(W, H, Math.min(W * 0.55, H * 0.38), Math.PI,         Math.PI * 1.5,    rng, 0.95);
    web(0, 0, Math.min(W * 0.4, H * 0.36),  0.05,            Math.PI / 2 - 0.05, rng, 0.9);   /* otra encima, mas cerrada */
    web(W, 0, Math.min(W * 0.4, H * 0.36),  Math.PI / 2 + 0.05, Math.PI - 0.05, rng, 0.9);

    /* hebras sueltas colgando del borde de arriba */
    dctx.save();
    dctx.lineCap = "round";
    dctx.strokeStyle = "rgba(226,228,234,0.30)";
    dctx.lineWidth = 0.9;
    for (let i = 0; i < 6; i++) {
      const x0 = W * (0.18 + rng() * 0.64), len = H * (0.05 + rng() * 0.15);
      dctx.beginPath();
      dctx.moveTo(x0, 0);
      dctx.quadraticCurveTo(x0 + (rng() - 0.5) * 44, len * 0.5, x0 + (rng() - 0.5) * 30, len);
      dctx.stroke();
    }
    dctx.restore();

    paintDecay(rng);
  }

  /* ---------- abandono: manchas de agua, moho, grietas, goteras, pelusas, rayones, bichos muertos ---------- */
  function paintDecay(rng){
    const M = Math.min(W, H);

    /* manchas de humedad con aros, como cuando se filtra el agua */
    for (let k = 0; k < 6; k++) {
      const x = rng() * W, y = rng() * H, r = M * (0.12 + rng() * 0.22), sy = 0.6 + rng() * 0.5;
      const g = dctx.createRadialGradient(x, y, r * 0.1, x, y, r);
      g.addColorStop(0, "rgba(70,50,28,0)"); g.addColorStop(0.7, "rgba(70,50,28,0.20)"); g.addColorStop(1, "rgba(70,50,28,0)");
      dctx.save(); dctx.translate(x, y); dctx.scale(1, sy); dctx.translate(-x, -y);
      dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, r, 0, Math.PI * 2); dctx.fill();
      dctx.strokeStyle = "rgba(96,70,36,0.28)"; dctx.lineWidth = 2 + rng() * 3;
      dctx.beginPath(); dctx.arc(x, y, r * (0.78 + rng() * 0.1), 0, Math.PI * 2); dctx.stroke();
      dctx.strokeStyle = "rgba(30,20,10,0.22)"; dctx.lineWidth = 1.2;
      dctx.beginPath(); dctx.arc(x, y, r * (0.52 + rng() * 0.1), 0, Math.PI * 2); dctx.stroke();
      dctx.restore();
    }

    /* moho en las esquinas y abajo */
    const corners = [[0, 0], [W, 0], [0, H], [W, H], [W * 0.5, H], [W * 0.25, H], [W * 0.8, H]];
    corners.forEach(([cx, cy], ci) => {
      const n = ci < 4 ? 70 : 26;
      for (let i = 0; i < n; i++) {
        const a = rng() * Math.PI * 2, d = Math.pow(rng(), 1.8) * M * (ci < 4 ? 0.5 : 0.22);
        const x = cx + Math.cos(a) * d, y = cy + Math.sin(a) * d, r = 5 + rng() * 26;
        const tone = rng() < 0.7 ? "22,32,18" : "40,52,30";
        const g = dctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, `rgba(${tone},${0.22 + rng() * 0.3})`); g.addColorStop(1, `rgba(${tone},0)`);
        dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, r, 0, Math.PI * 2); dctx.fill();
      }
    });

    /* grietas */
    for (let k = 0; k < 7; k++) {
      let x = rng() * W, y = rng() * H, ang = rng() * Math.PI * 2;
      const segs = 9 + (rng() * 9 | 0), step = M * (0.025 + rng() * 0.03);
      const branches = [];
      dctx.lineCap = "round"; dctx.lineJoin = "round";
      for (const pass of [0, 1]) {
        let px = x, py = y, pa = ang;
        dctx.beginPath(); dctx.moveTo(px + pass, py + pass);
        for (let s = 0; s < segs; s++) {
          pa += (rng() - 0.5) * 0.9; px += Math.cos(pa) * step; py += Math.sin(pa) * step;
          dctx.lineTo(px + pass, py + pass);
          if (!pass && rng() < 0.22) branches.push([px, py, pa + (rng() < 0.5 ? 1 : -1) * (0.6 + rng() * 0.6)]);
        }
        dctx.strokeStyle = pass ? "rgba(190,180,160,0.14)" : "rgba(0,0,0,0.6)";
        dctx.lineWidth = pass ? 1 : 1.5 + rng() * 1.2; dctx.stroke();
      }
      for (const [bx, by, ba] of branches) {
        dctx.beginPath(); dctx.moveTo(bx, by);
        let px = bx, py = by, pa = ba;
        for (let s = 0; s < 4; s++) { pa += (rng() - 0.5) * 0.9; px += Math.cos(pa) * step * 0.7; py += Math.sin(pa) * step * 0.7; dctx.lineTo(px, py); }
        dctx.strokeStyle = "rgba(0,0,0,0.5)"; dctx.lineWidth = 1; dctx.stroke();
      }
    }

    /* goteras: chorros oscuros con gota al final */
    for (let k = 0; k < 11; k++) {
      const x = rng() * W, len = H * (0.12 + rng() * 0.45), w = 2 + rng() * 5;
      const g = dctx.createLinearGradient(x, 0, x, len);
      g.addColorStop(0, "rgba(14,10,6,0)"); g.addColorStop(0.3, "rgba(14,10,6,0.42)"); g.addColorStop(1, "rgba(14,10,6,0.5)");
      dctx.fillStyle = g; dctx.fillRect(x - w / 2, 0, w, len);
      dctx.beginPath(); dctx.arc(x, len, w * 0.9, 0, Math.PI * 2); dctx.fillStyle = "rgba(14,10,6,0.52)"; dctx.fill();
    }

    /* pelusas de polvo en el piso */
    for (let k = 0; k < 18; k++) {
      const x = rng() * W, y = H * (0.86 + rng() * 0.14), r = 8 + rng() * 22;
      const g = dctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, "rgba(150,144,132,0.34)"); g.addColorStop(1, "rgba(150,144,132,0)");
      dctx.fillStyle = g; dctx.beginPath(); dctx.arc(x, y, r, 0, Math.PI * 2); dctx.fill();
      dctx.strokeStyle = "rgba(170,164,152,0.3)"; dctx.lineWidth = 0.7;
      for (let j = 0; j < 14; j++) {
        const a = rng() * Math.PI * 2, rr = r * (0.5 + rng() * 0.7);
        dctx.beginPath(); dctx.moveTo(x, y); dctx.quadraticCurveTo(x + Math.cos(a + 0.6) * rr * 0.6, y + Math.sin(a + 0.6) * rr * 0.6, x + Math.cos(a) * rr, y + Math.sin(a) * rr); dctx.stroke();
      }
    }

    /* rayones y marcas de dedos */
    dctx.lineCap = "round";
    for (let k = 0; k < 44; k++) {
      const x = rng() * W, y = rng() * H, a = rng() * Math.PI, l = 10 + rng() * 60;
      dctx.strokeStyle = `rgba(200,190,170,${0.05 + rng() * 0.1})`; dctx.lineWidth = 0.6 + rng() * 0.8;
      dctx.beginPath(); dctx.moveTo(x, y); dctx.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); dctx.stroke();
    }
    for (let k = 0; k < 5; k++) {                        /* alguien paso la mano hace mucho */
      const x = W * (0.15 + rng() * 0.7), y = H * (0.2 + rng() * 0.5);
      for (let f = 0; f < 4; f++) {
        dctx.strokeStyle = "rgba(10,8,6,0.16)"; dctx.lineWidth = 6 + rng() * 4;
        dctx.beginPath(); dctx.moveTo(x + f * 14, y); dctx.quadraticCurveTo(x + f * 14 + (rng() - 0.5) * 16, y + 40, x + f * 14 + (rng() - 0.5) * 22, y + 80 + rng() * 40); dctx.stroke();
      }
    }

    /* bichos muertos atrapados en las telarañas */
    for (let k = 0; k < 6; k++) {
      const left = k % 2 === 0, x = (left ? 0 : W) + (left ? 1 : -1) * M * (0.08 + rng() * 0.3), y = M * (0.06 + rng() * 0.3);
      dctx.fillStyle = "rgba(12,9,7,0.85)"; dctx.beginPath(); dctx.ellipse(x, y, 3.2, 4.6, rng() * 3, 0, Math.PI * 2); dctx.fill();
      dctx.strokeStyle = "rgba(12,9,7,0.7)"; dctx.lineWidth = 0.8;
      for (let j = 0; j < 3; j++) { dctx.beginPath(); dctx.moveTo(x - 3, y + j * 2 - 2); dctx.lineTo(x - 8, y + j * 3 - 3); dctx.moveTo(x + 3, y + j * 2 - 2); dctx.lineTo(x + 8, y + j * 3 - 3); dctx.stroke(); }
    }
  }

  /* ---------- limpiar: borra el polvo y deja un resplandor tibio ---------- */
  function clean(x, y){
    dctx.save();
    dctx.globalCompositeOperation = "destination-out";
    const g = dctx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, "rgba(0,0,0,1)");
    g.addColorStop(0.55, "rgba(0,0,0,0.92)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    dctx.fillStyle = g;
    dctx.beginPath(); dctx.arc(x, y, R, 0, Math.PI * 2); dctx.fill();
    dctx.restore();

    const lg = lctx.createRadialGradient(x, y, 0, x, y, R * 1.25);
    lg.addColorStop(0, "rgba(255,196,120,0.05)");
    lg.addColorStop(1, "rgba(255,196,120,0)");
    lctx.fillStyle = lg;
    lctx.beginPath(); lctx.arc(x, y, R * 1.25, 0, Math.PI * 2); lctx.fill();

    markCoverage(x, y);
  }

  function stamp(x, y){
    clean(x, y);
    if (strokes.length < MAX_STROKE_VALUES) strokes.push(x / W, y / H);
    if (!finished && coveredCount / totalCells >= DONE_AT) finish();
  }

  /* termino de limpiar: queda guardado, se disuelve lo que falta y se vuelve al album */
  function finish(){
    finished = true;
    activePointer = null;
    last = null;
    torch.classList.remove("on");
    dirt.classList.remove("drawing");
    try { localStorage.setItem(CLEAN_FLAG, "1"); } catch (e) {}
    hideHint();
    dirt.classList.add("fade");
    relic.classList.add("gone");
    neon.classList.add("gone");
    document.getElementById("spider").classList.add("gone");
    document.getElementById("decay").classList.add("fade");
    document.getElementById("motes").classList.add("fade");
    document.getElementById("flash").classList.add("go");
    setTimeout(() => { location.replace("index.html?v=" + Date.now()); }, 2400);   /* ?v= para que nunca cargue una copia vieja guardada */
  }

  function replay(){
    for (let i = 0; i < strokes.length; i += 2) clean(strokes[i] * W, strokes[i + 1] * H);
  }

  /* ---------- interacción ---------- */
  let activePointer = null;
  let last = null;

  function strokeTo(x, y){
    if (!last) { stamp(x, y); last = { x, y }; return; }
    const dx = x - last.x, dy = y - last.y;
    const dist = Math.hypot(dx, dy);
    const n = Math.max(1, Math.floor(dist / (R * 0.3)));
    for (let i = 1; i <= n; i++) stamp(last.x + dx * i / n, last.y + dy * i / n);
    last = { x, y };
    updateRelic();
  }

  function moveTorch(x, y){
    const half = parseFloat(torch.style.width) / 2;
    torch.style.transform = `translate(${x - half}px, ${y - half}px)`;
  }

  function hideHint(){ hint.classList.add("gone"); }

  dirt.addEventListener("pointerdown", (e) => {
    if (finished || activePointer !== null) return;
    activePointer = e.pointerId;
    last = null;
    try { dirt.setPointerCapture(e.pointerId); } catch (err) {}
    dirt.classList.add("drawing");
    moveTorch(e.clientX, e.clientY);
    torch.classList.add("on");
    strokeTo(e.clientX, e.clientY);
    hideHint();
  });

  dirt.addEventListener("pointermove", (e) => {
    if (e.pointerId !== activePointer) return;
    moveTorch(e.clientX, e.clientY);
    strokeTo(e.clientX, e.clientY);
  });

  function endStroke(e){
    if (e.pointerId !== activePointer) return;
    activePointer = null;
    last = null;
    dirt.classList.remove("drawing");
    torch.classList.remove("on");
  }
  dirt.addEventListener("pointerup", endStroke);
  dirt.addEventListener("pointercancel", endStroke);
  dirt.addEventListener("lostpointercapture", endStroke);
  dirt.addEventListener("contextmenu", (e) => e.preventDefault());

  /* ---------- ambiente: estrellas escondidas y motas de polvo ---------- */
  function buildStars(){
    const box = document.getElementById("stars");
    const rng = mulberry32(77);
    for (let i = 0; i < 46; i++) {
      const s = document.createElement("span");
      s.className = "star";
      const size = 1 + rng() * 2.2;
      s.style.cssText = `left:${rng() * 100}%;top:${rng() * 58}%;width:${size}px;height:${size}px;--d:${2 + rng() * 4}s;--delay:${rng() * 4}s`;
      box.appendChild(s);
    }
  }

  function buildMotes(){
    const box = document.getElementById("motes");
    for (let i = 0; i < 46; i++) {
      const m = document.createElement("span");
      m.className = "mote";
      const size = 1.5 + Math.random() * 3;
      m.style.cssText =
        `left:${Math.random() * 100}%;top:${Math.random() * 100}%;width:${size}px;height:${size}px;` +
        `--d:${9 + Math.random() * 10}s;--delay:${-Math.random() * 14}s;--o:${0.25 + Math.random() * 0.4};` +
        `--dx:${(Math.random() - 0.5) * 70}px;--dy:${-30 - Math.random() * 80}px`;
      box.appendChild(m);
    }
  }

  function rebuild(){
    sizeCanvases();
    initCoverage();
    paintDirt();
    replay();
    updateRelic();
  }

  let resizeTimer;
  let lastW = window.innerWidth, lastH = window.innerHeight;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      if (window.innerWidth === lastW && window.innerHeight === lastH) return;
      lastW = window.innerWidth; lastH = window.innerHeight;
      rebuild();
    }, 150);
  });

  buildStars();
  buildMotes();
  rebuild();
  setTimeout(() => { relic.classList.add("in"); neon.classList.add("in"); }, 900);     /* la foto vieja y el letrero aparecen entre el polvo */
  document.fonts && document.fonts.ready && document.fonts.ready.then(() => rebuild());   /* al cargar la tipografia cambia el tamaño del titulo */
})();
</script>
</body>
</html>
