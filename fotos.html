<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1017">
<title>Nuestros momentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Caveat:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#f6c667;
    --coral:#ff6f8e;
    --paper:#fff3e4;
    --ink:#3a2440;
    --ink-soft:#6c5470;
    --wood-edge:#82572e #5a3919 #4a2f15 #704a25;   /* marco de madera: luz arriba/izquierda */
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    color:var(--paper);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    /* cuarto en penumbra: las luces de la pared son lo que brilla */
    background:
      radial-gradient(90% 55% at 50% 24%, rgba(255,170,90,.20), transparent 65%),
      linear-gradient(180deg, #2a1b22 0%, #1a1017 55%, #110a10 100%);
    background-attachment:fixed;
  }
  h1,h2{ margin:0; }
  .script{ font-family:"Caveat", cursive; }
  .chalk{
    font-family:"Caveat", cursive;
    color:#f4efe6;
    text-shadow:0 0 1.5px rgba(255,255,255,.7), 0 0 14px rgba(255,255,255,.1);
  }

  /* ---------- seccion de introduccion (antes de la pared) ---------- */
  .intro{
    min-height:100vh;
    min-height:100svh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:26px 14px 18px;
    text-align:center;
  }
  .intro .rope{ width:100%; max-width:880px; margin-bottom:6px; }
  .intro .wire path{ stroke:#3c4d39; }
  .intro .cinema{
    width:min(100%, 760px);
    animation:lower 1.3s cubic-bezier(.2,.7,.2,1) .5s backwards;     /* el "telon" baja desde las luces */
  }
  @keyframes lower{
    from{ clip-path:inset(0 0 100% 0); opacity:.2; }
    to  { clip-path:inset(0 0 0 0); opacity:1; }
  }
  .cue{
    margin-top:26px;
    background:none; border:0; padding:6px 12px;
    font-family:"Caveat", cursive;
    font-size:1.55rem;
    color:#f3d9c4;
    cursor:pointer;
    animation:bob 2.2s ease-in-out infinite;
    transition:color .4s ease, text-shadow .4s ease;
  }
  .cue.hot{ color:var(--gold); text-shadow:0 0 18px rgba(246,198,103,.8); }
  @keyframes bob{ 50%{ transform:translateY(7px); } }

  /* ---------- letrero de pizarra ---------- */
  .signwrap{ position:relative; z-index:3; padding:34px 16px 0; }
  .sign{
    max-width:560px;
    margin:0 auto;
    padding:22px 18px 20px;
    text-align:center;
    background:
      radial-gradient(90% 80% at 25% 15%, rgba(255,255,255,.07), transparent 60%),
      radial-gradient(70% 60% at 85% 90%, rgba(255,255,255,.04), transparent 60%),
      #222221;
    border:12px solid;
    border-color:var(--wood-edge);
    border-radius:4px;
    box-shadow:0 22px 40px -14px rgba(0,0,0,.85), inset 0 0 0 2px rgba(0,0,0,.4), inset 0 0 46px rgba(0,0,0,.55);
  }
  .sign .l1{ font-size:1.7rem; margin:0; }
  .sign h1{
    font-family:"Caveat", cursive;
    font-size:clamp(2.5rem, 10vw, 3.9rem);
    font-weight:700;
    line-height:1;
    margin:2px 0 6px;
    letter-spacing:.01em;
  }
  .sign .l3{ font-size:1.5rem; margin:0; color:#eadfce; }

  /* ---------- la pared de tablas ---------- */
  .wall{
    position:relative;
    width:calc(100% - 20px);
    max-width:880px;
    margin:-12px auto 0;
    padding:46px 14px 30px;
    border-radius:6px;
    background:
      linear-gradient(0deg, rgba(0,0,0,.36) 0 3px, transparent 3px) 0 0 / 100% 96px,                     /* juntas entre tablas */
      linear-gradient(0deg, rgba(255,214,160,.08) 0 48px, rgba(0,0,0,.06) 48px 96px) 0 0 / 100% 192px,   /* cada tabla de otro tono */
      repeating-linear-gradient(0deg, rgba(255,235,200,.035) 0 1px, transparent 1px 6px),                /* veta */
      linear-gradient(90deg, #8d5d37, #a5733f 28%, #92623a 55%, #a97745 80%, #8d5d37);
    box-shadow:
      0 34px 70px -24px rgba(0,0,0,.85),
      0 0 90px 10px rgba(255,170,80,.14),
      inset 0 0 70px rgba(0,0,0,.5),
      inset 0 0 0 6px #5b3a1d;
  }

  /* ---------- cuerda con luces ---------- */
  .rope{
    position:relative;
    margin:0 -14px 26px;
  }
  .wire{
    position:absolute; left:0; top:0;
    width:100%;
    overflow:visible;
    pointer-events:none;
  }
  .bulb{
    position:absolute;
    z-index:3;
    width:10px; height:14px;
    margin-left:-5px;
    border-radius:50% 50% 55% 55% / 40% 40% 60% 60%;
    background:radial-gradient(circle at 45% 35%, #fffbe6 0 25%, #ffd978 55%, #f4a93a 100%);
    box-shadow:0 0 6px 2px rgba(255,214,120,.95), 0 0 20px 7px rgba(255,170,70,.5);
    animation:glow var(--d, 3s) ease-in-out infinite alternate;
    pointer-events:none;
  }
  .bulb::before{                                /* casquillo */
    content:"";
    position:absolute; left:50%; top:-4px;
    width:6px; height:5px; margin-left:-3px;
    background:#1d2a1b;
    border-radius:1px;
  }
  @keyframes glow{ from{ opacity:.74; } to{ opacity:1; } }

  .cells{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:repeat(var(--k), minmax(0,1fr));
    align-items:start;
    padding:0 14px;
  }
  .cell{ display:flex; justify-content:center; }

  /* ---------- fotos colgadas con ganchito ---------- */
  .frame{
    position:relative;
    margin:0;
    width:86%;
    max-width:178px;
    background:var(--paper);
    padding:10px 10px 0;
    border-radius:3px;
    box-shadow:0 16px 26px -12px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.06);
    transform-origin:50% 0;
    transform:rotate(var(--r));
    cursor:pointer;
    animation:
      sway calc(5s + var(--i) * .35s) ease-in-out infinite alternate,
      rise .8s cubic-bezier(.2,.7,.2,1) backwards;
    animation-delay:0s, calc(var(--i) * 80ms + 150ms);
  }
  .frame:focus-visible{ outline:3px solid var(--gold); outline-offset:5px; }
  @keyframes sway{
    from{ transform:rotate(calc(var(--r) - 1.3deg)); }
    to  { transform:rotate(calc(var(--r) + 1.3deg)); }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(24px) rotate(var(--r)); }
  }
  .frame::before{                               /* ganchito de madera */
    content:"";
    position:absolute; top:-15px; left:50%;
    width:12px; height:28px;
    margin-left:-6px;
    background:linear-gradient(90deg, #d9aa6e 0 44%, #6e4a26 44% 56%, #d9aa6e 56%);
    border-radius:3px;
    box-shadow:0 2px 4px rgba(0,0,0,.45);
    z-index:4;
  }
  .photo{
    aspect-ratio:4/5;
    background:#e9cdb7;
    border-radius:2px;
    overflow:hidden;
    position:relative;
  }
  .photo img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* hueco vacio, listo para recibir la foto */
  .frame.empty .photo,
  .lb-photo.empty .photo{
    background:
      repeating-linear-gradient(45deg, rgba(58,36,64,.045) 0 10px, transparent 10px 20px),
      linear-gradient(160deg, #f6e3cf, #ecc9b0);
  }
  .ph{
    position:absolute; inset:8px;
    border:1.5px dashed rgba(58,36,64,.3);
    border-radius:3px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:5px;
    text-align:center;
    color:var(--ink-soft);
  }
  .ph-icon{ font-size:1.9rem; opacity:.55; }
  .ph-text{ font-family:"Caveat", cursive; font-size:1.25rem; }

  figcaption{
    display:flex; align-items:center; gap:8px;
    padding:10px 3px 13px;
    min-height:3.3em;
    font-family:"Caveat", cursive;
    font-size:1.2rem;
    line-height:1.12;
    color:var(--ink);
  }
  .num{
    flex:none;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid rgba(58,36,64,.3);
    display:flex; align-items:center; justify-content:center;
    font-family:"Fraunces", serif;
    font-size:.74rem;
    color:#b07a2a;
  }
  .soft{ color:var(--ink-soft); opacity:.75; }

  /* ---------- placa de pizarra y marco de video (mi reaccion / introduccion) ---------- */
  .reaction{ text-align:center; padding:6px 0 10px; }
  .plate{
    display:inline-block;
    padding:6px 26px 10px;
    margin:6px 0 20px;
    background:#242423;
    border:6px solid;
    border-color:var(--wood-edge);
    border-radius:5px;
    box-shadow:0 12px 22px -10px rgba(0,0,0,.8), inset 0 0 22px rgba(0,0,0,.5);
    position:relative;
    z-index:4;
  }
  .plate .e{ font-size:1.25rem; color:#f2d9a0; margin:0; }
  .plate h2{ font-family:"Caveat", cursive; font-size:2.2rem; font-weight:700; line-height:1.05; }

  .cinema{
    --ratio:1.7778;
    position:relative;
    margin:0 auto;
    width:min(100%, 720px);
    background:#0c0710;
    border:10px solid;
    border-color:var(--wood-edge);
    border-radius:5px;
    box-shadow:0 24px 44px -18px rgba(0,0,0,.85), inset 0 0 0 2px rgba(0,0,0,.45);
    animation:rise .9s cubic-bezier(.2,.7,.2,1) .2s backwards;
  }
  .screen{
    aspect-ratio:var(--ratio);
    width:min(100%, calc(70vh * var(--ratio)));
    margin:0 auto;
    overflow:hidden;
    background:#07050b;
    position:relative;
  }
  .screen video{ width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  .cinema.empty .screen{
    background:
      radial-gradient(70% 70% at 50% 40%, rgba(255,154,90,.22), transparent 70%),
      linear-gradient(160deg, #241532, #130b1d);
  }
  .cinema.empty .screen-in{
    position:absolute; inset:10px;
    border:1.5px dashed rgba(255,214,170,.32);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px;
    color:#f3d9c4;
  }
  .playdot{
    flex:none;
    width:76px; height:76px;
    border-radius:50%;
    border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold);
    font-size:1.9rem;
    padding-left:6px;
    box-shadow:0 0 34px rgba(246,198,103,.28);
  }
  .screen-in .ph-text{ font-size:1.45rem; color:#f3d9c4; text-align:center; padding:0 10px; }
  .cinema-cap{
    margin:14px 6px 4px;
    font-family:"Caveat", cursive;
    font-size:1.45rem;
    color:#fff3e4;
    text-shadow:0 2px 10px rgba(0,0,0,.7);
  }

  /* ---------- foto ampliada + comentario que se despliega al lado ---------- */
  .lb{
    position:fixed; inset:0; z-index:100;
    display:flex;
    overflow-y:auto;
    padding:62px 16px 30px;
    background:rgba(10,6,10,.93);
    opacity:0; visibility:hidden;
    transition:opacity .35s ease, visibility 0s linear .35s;
  }
  .lb.show{ opacity:1; visibility:visible; transition:opacity .35s ease; }
  .lb-stage{ margin:auto; display:flex; align-items:center; justify-content:center; }
  .lb-photo{
    position:relative;
    flex:none;
    margin:0;
    width:min(400px, 44vw);
    background:var(--paper);
    padding:14px 14px 0;
    border-radius:4px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.06);
  }
  .lb-photo figcaption{ font-size:1.5rem; padding:12px 4px 16px; min-height:3.4em; }
  .lb-photo .num{ width:30px; height:30px; font-size:.82rem; }
  .lb-photo .ph-text{ font-size:1.5rem; }
  .lb-photo .ph-icon{ font-size:2.6rem; }
  .lb-fade{ transition:opacity .17s ease; }
  .lb-fade.swap{ opacity:0; }

  /* el comentario: un recuadro que se abre hacia un lado */
  .lb-notewrap{
    display:grid;
    grid-template-columns:0fr;
    transition:grid-template-columns .7s cubic-bezier(.2,.8,.2,1);
  }
  .lb-notewrap.open{ grid-template-columns:1fr; }
  .lb-note{ min-width:0; overflow:hidden; }
  .lb-note-in{
    width:300px;
    margin-left:26px;
    padding:18px 20px 20px;
    background:
      radial-gradient(90% 80% at 25% 10%, rgba(255,255,255,.07), transparent 60%),
      #242423;
    border:8px solid;
    border-color:var(--wood-edge);
    border-radius:5px;
    box-shadow:0 22px 40px -16px rgba(0,0,0,.9), inset 0 0 30px rgba(0,0,0,.5);
    max-height:min(560px, 78vh);
    overflow-y:auto;
  }
  .lb-note-in .e{ font-size:1.25rem; color:#f2d9a0; margin:0 0 6px; }
  .lb-note-in .body{ font-size:1.6rem; line-height:1.22; margin:0; }
  .lb-note-in .dim{ opacity:.55; }
  .lb-note-in .sig{ font-size:1.35rem; color:#f2d9a0; text-align:right; margin:12px 0 0; }

  .lb-close, .lb-nav{
    position:fixed; z-index:5;
    width:44px; height:44px;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.24);
    color:#fff6ea;
    font-size:1.7rem; line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:0 0 3px;
  }
  .lb-close{ top:14px; right:14px; font-size:1.9rem; }
  .lb-nav{ top:50%; margin-top:-22px; }
  .lb-nav.prev{ left:14px; }
  .lb-nav.next{ right:14px; }
  .lb-close:hover, .lb-nav:hover{ background:rgba(255,255,255,.2); }

  /* ---------- pie ---------- */
  footer{ text-align:center; padding:44px 20px 54px; color:#8f7388; font-size:.85rem; }
  footer .script{ display:block; font-size:1.3rem; color:var(--gold); margin-bottom:6px; }
  footer a{ color:#c9a98f; text-decoration:none; border-bottom:1px solid rgba(201,169,143,.4); }
  footer a:hover{ color:var(--gold); border-color:var(--gold); }
  footer .heart{ color:var(--coral); }
  footer p{ margin:16px 0 0; }

  /* ---------- celular ---------- */
  @media (max-width:759px){
    .lb{ padding:60px 16px 74px; }
    .lb-stage{ flex-direction:column; }
    .lb-photo{ width:min(300px, 74vw); padding:12px 12px 0; }
    .lb-photo figcaption{ font-size:1.3rem; min-height:3em; }
    .lb-notewrap{
      grid-template-columns:1fr;
      grid-template-rows:0fr;
      transition:grid-template-rows .7s cubic-bezier(.2,.8,.2,1);
    }
    .lb-notewrap.open{ grid-template-rows:1fr; }
    .lb-note{ min-height:0; }
    .lb-note-in{ width:min(300px, 74vw); margin:20px auto 0; max-height:none; }
    .lb-note-in .body{ font-size:1.5rem; }
    .lb-nav{ top:auto; bottom:16px; margin-top:0; width:42px; height:42px; }
    .lb-nav.prev{ left:18px; }
    .lb-nav.next{ right:18px; }
  }
  @media (max-width:599px){
    .wall{ padding-top:40px; }
    figcaption{ font-size:1.05rem; padding:8px 2px 11px; min-height:3em; gap:6px; }
    .num{ width:22px; height:22px; font-size:.68rem; }
    .ph-text{ font-size:1.08rem; }
    .ph-icon{ font-size:1.6rem; }
    .plate h2{ font-size:1.9rem; }
    .playdot{ width:56px; height:56px; font-size:1.5rem; padding-left:4px; }
    .cinema.empty .screen-in{ gap:8px; }
    .screen-in .ph-text{ font-size:1.2rem; line-height:1.1; }
    .lb-photo figcaption{ font-size:1.3rem; }
    .lb-photo .num{ width:28px; height:28px; font-size:.78rem; }
    .lb-photo .ph-text{ font-size:1.4rem; }
    .lb-photo .ph-icon{ font-size:2.2rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .frame, .cinema, .bulb, .cue, .intro .cinema{ animation:none; }
    .lb-notewrap{ transition:none; }
  }
</style>
</head>
<body>

<!-- 1) introduccion: el video que se despliega antes de ver las fotos -->
<section class="intro" id="intro" aria-label="Introducción">
  <div class="reaction" id="intro-body"></div>
  <button class="cue" id="cue" type="button">sigue bajando ↓</button>
</section>

<!-- 2) la pared de fotos -->
<header class="signwrap" id="wall-top">
  <div class="sign">
    <p class="chalk l1" id="sign-1"></p>
    <h1 class="chalk" id="sign-title"></h1>
    <p class="chalk l3" id="sign-3"></p>
  </div>
</header>

<main class="wall" id="wall">
  <div id="rows"></div>
  <section class="reaction" id="reaction" aria-label="Mi reacción en video"></section>
</main>

<footer>
  <span class="script">gracias por estar</span>
  hecho con <span class="heart">♡</span> para ti
  <p><a href="index.html">← volver a las canciones</a></p>
</footer>

<!-- foto ampliada + comentario -->
<div class="lb" id="lb" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <button class="lb-close" id="lb-close" type="button" aria-label="Cerrar">×</button>
  <button class="lb-nav prev" id="lb-prev" type="button" aria-label="Foto anterior">‹</button>
  <button class="lb-nav next" id="lb-next" type="button" aria-label="Foto siguiente">›</button>
  <div class="lb-stage" id="lb-stage">
    <figure class="lb-photo" id="lb-photo"><div class="lb-fade" id="lb-in"></div></figure>
    <div class="lb-notewrap" id="lb-notewrap">
      <div class="lb-note"><div class="lb-note-in lb-fade" id="lb-note-in"></div></div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   ✏️  CÓMO LLENAR ESTA PÁGINA
   -----------------------------------------------------------------
   INTRO    → el video de introducción (la primera sección):
               video   → ruta del video (ej. "media/fotos/intro.mp4")
               poster  → imagen de portada (opcional)
               eyebrow / title / caption → los textos de la sección
   SIGN     → los textos del letrero de pizarra sobre la pared de fotos.
   PHOTOS   → las 10 fotos. Cada una tiene:
               src     → ruta de la foto (ej. "media/fotos/01.jpg").
                         Déjalo vacío "" y se ve el hueco con su marco.
               caption → texto chiquito debajo de la foto (opcional)
               comment → TU comentario: aparece al tocar la foto, en un
                         recuadro que se despliega al lado de la foto
                         ampliada.
   REACTION → tu video del final (igual que INTRO).
   Los videos se ajustan solos a horizontal o vertical.
   Mándame las fotos, los comentarios y los videos y yo los pongo aquí.
   ===================================================================== */

const INTRO = {
  eyebrow: "antes de empezar",
  title: "Mira esto primero",
  video: "",
  poster: "",
  caption: ""
};

const SIGN = {
  line1: "para ti, Cami",
  title: "Nuestros momentos",
  line3: "diez recuerdos que quería que vieras"
};

const PHOTOS = [
  { src: "", caption: "", comment: "" },
  { src: "", caption: "", comment: "" },
  { src: "", caption: "", comment: "" },
  { src: "", caption: "", comment: "" },
  { src: "", caption: "", comment: "" },
  { src: "", caption: "", comment: "" },
  { src: "", caption: "", comment: "" },
  { src: "", caption: "", comment: "" },
  { src: "", caption: "", comment: "" },
  { src: "", caption: "", comment: "" }
];

const REACTION = {
  eyebrow: "y ahora, mírame a mí",
  title: "Mi reacción",
  video: "",
  poster: "",
  caption: ""
};

/* ------------------------- render (no tocar) ------------------------- */
document.getElementById("sign-1").textContent = SIGN.line1;
document.getElementById("sign-title").textContent = SIGN.title;
document.getElementById("sign-3").textContent = SIGN.line3;

const ROT = [-2.4, 1.8, -1.2, 2.6, -2, 1.2, -2.8, 2.1, -1.5, 2.4];
const SAG = 34;                                   /* cuanto cuelga la cuerda en el centro (px) */
const wireY = (t) => 3 + 4 * SAG * t * (1 - t);   /* altura de la cuerda en la posicion t (0-1) */

/* ---------- foto ampliada con comentario ---------- */
const lb = document.getElementById("lb");
const lbStage = document.getElementById("lb-stage");
const lbPhoto = document.getElementById("lb-photo");
const lbIn = document.getElementById("lb-in");
const lbNoteWrap = document.getElementById("lb-notewrap");
const lbNoteIn = document.getElementById("lb-note-in");
let lbIndex = -1, lbThumb = null, lbTimer = null;
let frameEls = [];

function frameInner(p, i){
  const n = String(i + 1).padStart(2, "0");
  return `
    <div class="photo">
      ${p.src
        ? `<img src="${p.src}" alt="${p.caption || "recuerdo " + n}" loading="lazy">`
        : `<div class="ph"><span class="ph-icon">📷</span><span class="ph-text">tu foto aquí</span></div>`}
    </div>
    <figcaption>
      <span class="num">${n}</span>
      ${p.caption ? `<span>${p.caption}</span>` : `<span class="soft">aquí va el recuerdo</span>`}
    </figcaption>`;
}

function lbFill(i){
  const p = PHOTOS[i];
  lbPhoto.classList.toggle("empty", !p.src);
  lbIn.innerHTML = frameInner(p, i);
  lbNoteIn.innerHTML = `
    <p class="chalk e">mi comentario</p>
    <p class="chalk body">${p.comment ? p.comment : `<span class="dim">aquí va mi comentario sobre esta foto</span>`}</p>
    <p class="chalk sig">— Marcelo</p>`;
}

function openLightbox(i){
  const thumb = frameEls[i];
  if (!thumb) return;
  clearTimeout(lbTimer);
  lbIndex = i;
  lbThumb = thumb;
  lbFill(i);
  lbNoteWrap.classList.remove("open");
  lb.classList.add("show");
  lb.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";

  /* la foto "se despega" de la pared: arranca del tamano y lugar de la miniatura y crece al centro */
  lbPhoto.style.transition = "none";
  lbPhoto.style.transform = "none";
  const t = thumb.getBoundingClientRect();
  const f = lbPhoto.getBoundingClientRect();
  const dx = (t.left + t.width / 2) - (f.left + f.width / 2);
  const dy = (t.top + t.height / 2) - (f.top + f.height / 2);
  const s = thumb.offsetWidth / f.width;
  lbPhoto.style.transform = `translate(${dx}px, ${dy}px) scale(${s}) rotate(${ROT[i % ROT.length]}deg)`;
  thumb.style.visibility = "hidden";
  void lbPhoto.offsetWidth;
  lbPhoto.style.transition = "transform .62s cubic-bezier(.2,.8,.2,1)";
  lbPhoto.style.transform = "none";

  /* y cuando ya esta grande, se despliega el comentario al lado */
  lbTimer = setTimeout(() => lbNoteWrap.classList.add("open"), 430);
}

function closeLightbox(){
  if (!lb.classList.contains("show")) return;
  clearTimeout(lbTimer);
  lbNoteWrap.classList.remove("open");
  lbPhoto.style.transition = "transform .3s ease";
  lbPhoto.style.transform = "scale(.9)";
  lb.classList.remove("show");
  lb.setAttribute("aria-hidden", "true");
  if (lbThumb) lbThumb.style.visibility = "";
  document.body.style.overflow = "";
  lbIndex = -1;
  lbThumb = null;
}

function lbGo(j){
  const n = PHOTOS.length;
  j = (j + n) % n;
  if (lbIndex < 0 || j === lbIndex || !frameEls[j]) return;
  if (lbThumb) lbThumb.style.visibility = "";
  lbIndex = j;
  lbThumb = frameEls[j];
  lbThumb.style.visibility = "hidden";
  const fades = lb.querySelectorAll(".lb-fade");
  fades.forEach(el => el.classList.add("swap"));
  setTimeout(() => {
    lbFill(j);
    fades.forEach(el => el.classList.remove("swap"));
  }, 170);
}

document.getElementById("lb-close").addEventListener("click", closeLightbox);
document.getElementById("lb-prev").addEventListener("click", () => lbGo(lbIndex - 1));
document.getElementById("lb-next").addEventListener("click", () => lbGo(lbIndex + 1));
lb.addEventListener("click", (e) => { if (e.target === lb || e.target === lbStage) closeLightbox(); });
document.addEventListener("keydown", (e) => {
  if (!lb.classList.contains("show")) return;
  if (e.key === "Escape") closeLightbox();
  else if (e.key === "ArrowLeft") lbGo(lbIndex - 1);
  else if (e.key === "ArrowRight") lbGo(lbIndex + 1);
});

/* ---------- la pared ---------- */
function makeFrame(p, i){
  const n = String(i + 1).padStart(2, "0");
  const fig = document.createElement("figure");
  fig.className = "frame" + (p.src ? "" : " empty");
  fig.style.setProperty("--r", ROT[i % ROT.length] + "deg");
  fig.style.setProperty("--i", i);
  fig.tabIndex = 0;
  fig.setAttribute("role", "button");
  fig.setAttribute("aria-label", "Ver la foto " + n + " y mi comentario");
  fig.innerHTML = frameInner(p, i);
  fig.addEventListener("click", () => openLightbox(i));
  fig.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLightbox(i); }
  });
  return fig;
}

/* una cuerda con luces; si trae fotos, quedan colgadas de ella */
function makeRope(slice, K, startIndex){
  const row = document.createElement("div");
  row.className = "rope";
  row.style.setProperty("--k", K);
  row.style.minHeight = (SAG + 12) + "px";

  const bulbsN = K >= 5 ? 24 : 9;
  let bulbs = "";
  for (let b = 0; b < bulbsN; b++) {
    const t = (b + 0.5) / bulbsN;
    bulbs += `<i class="bulb" style="left:${(t * 100).toFixed(2)}%;top:${(wireY(t) + 2).toFixed(1)}px;--d:${(2.2 + ((b * 37) % 17) / 10).toFixed(1)}s;animation-delay:${(((b * 53) % 20) / 10).toFixed(1)}s"></i>`;
  }
  row.innerHTML = `
    <svg class="wire" viewBox="0 0 100 ${SAG + 8}" preserveAspectRatio="none" style="height:${SAG + 8}px" aria-hidden="true">
      <path d="M0,3 Q50,${3 + 2 * SAG} 100,3" fill="none" stroke="#1d2a1b" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
    </svg>
    ${bulbs}
  `;

  if (slice.length) {
    const cells = document.createElement("div");
    cells.className = "cells";
    slice.forEach((p, j) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.marginTop = wireY((j + 0.5) / K).toFixed(1) + "px";
      cell.appendChild(makeFrame(p, startIndex + j));
      cells.appendChild(cell);
    });
    row.appendChild(cells);
  }
  return row;
}

/* celular: 2 fotos por cuerda; pantalla grande: 5 por cuerda */
const bigScreen = window.matchMedia("(min-width:900px)");
function buildRows(){
  closeLightbox();
  const K = bigScreen.matches ? 5 : 2;
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  for (let s = 0; s < PHOTOS.length; s += K) {
    rows.appendChild(makeRope(PHOTOS.slice(s, s + K), K, s));
  }
  frameEls = [...rows.querySelectorAll(".frame")];
}
buildRows();
if (bigScreen.addEventListener) bigScreen.addEventListener("change", buildRows);
else bigScreen.addListener(buildRows);

/* ---------- secciones de video: luces arriba, placa de pizarra y marco de madera ---------- */
function mountVideo(el, cfg, emptyLabel){
  el.innerHTML = `
    <div class="plate">
      <p class="chalk e">${cfg.eyebrow}</p>
      <h2 class="chalk">${cfg.title}</h2>
    </div>
    <div class="cinema${cfg.video ? "" : " empty"}">
      <div class="screen">
        ${cfg.video
          ? `<video controls playsinline preload="metadata" poster="${cfg.poster || ""}">
               <source src="${cfg.video}" type="video/mp4">
             </video>`
          : `<div class="screen-in">
               <div class="playdot">▶</div>
               <span class="ph-text">${emptyLabel}</span>
             </div>`}
      </div>
    </div>
    ${cfg.caption ? `<p class="cinema-cap">${cfg.caption}</p>` : ""}
  `;
  el.prepend(makeRope([], 1, 0));

  /* el marco se adapta a horizontal o vertical segun el archivo real */
  const v = el.querySelector("video");
  if (v) {
    v.addEventListener("loadedmetadata", () => {
      if (v.videoWidth && v.videoHeight) {
        el.querySelector(".cinema").style.setProperty("--ratio", v.videoWidth / v.videoHeight);
      }
    });
  }
  return v;
}

const introVideo = mountVideo(document.getElementById("intro-body"), INTRO, "aquí va el video de introducción");
mountVideo(document.getElementById("reaction"), REACTION, "aquí va mi video");

/* "sigue bajando": lleva a la pared de fotos; brilla mas cuando termina la introduccion */
const cue = document.getElementById("cue");
cue.addEventListener("click", () => {
  document.getElementById("wall-top").scrollIntoView({ behavior: "smooth", block: "start" });
});
if (introVideo) introVideo.addEventListener("ended", () => cue.classList.add("hot"));
</script>
