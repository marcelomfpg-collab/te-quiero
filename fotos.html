<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a1017">
<title>Nuestros momentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Caveat:wght@500;700&family=Work+Sans:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#f6c667;
    --coral:#ff6f8e;
    --paper:#fff3e4;
    --ink:#3a2440;
    --ink-soft:#6c5470;
    --wood-edge:#82572e #5a3919 #4a2f15 #704a25;   /* marco de madera: luz arriba/izquierda */
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    color:var(--paper);
    font-family:"Work Sans", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    background:#140c12;
    position:relative;
  }
  /* fondo: muro de ladrillo disenado (media/fotos/ladrillo.svg, generado con tools/gen_ladrillo.py),
     fijo detras de todo, con luz calida desde arriba y vineta para que el texto se lea */
  body::before{
    content:"";
    position:fixed; inset:0; z-index:-2;
    background:
      radial-gradient(70% 45% at 50% 0%, rgba(255,184,110,.30), transparent 72%),
      radial-gradient(120% 90% at 50% 40%, rgba(14,8,10,0) 35%, rgba(10,5,8,.70) 100%),
      linear-gradient(180deg, rgba(22,10,12,.18) 0%, rgba(18,9,12,.38) 60%, rgba(12,6,9,.62) 100%),
      url("media/fotos/ladrillo.svg") center top / 1000px auto repeat;
  }
  /* guirnalda de luces colgando del muro (se dibuja con JS segun el ancho) */
  .fairy{ position:fixed; top:0; left:0; width:100%; height:220px; z-index:-1; pointer-events:none; overflow:hidden; }
  .fairy svg{ width:100%; height:100%; display:block; overflow:visible; }
  .fairy .wire{ fill:none; stroke:#1a0f0c; stroke-width:1.6; opacity:.85; }
  .fairy .glow{ fill:url(#fgl); animation:ftw 3.6s ease-in-out infinite; }
  .fairy .core{ fill:#ffe2a8; }
  @keyframes ftw{ 0%,100%{ opacity:.95 } 50%{ opacity:.55 } }
  h1,h2{ margin:0; }
  .script{ font-family:"Caveat", cursive; }
  .chalk{
    font-family:"Caveat", cursive;
    color:#f4efe6;
    text-shadow:0 0 1.5px rgba(255,255,255,.7), 0 0 14px rgba(255,255,255,.1);
  }

  /* ---------- barra de pestanas: cada una abre una seccion distinta ---------- */
  .topnav{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:14px;
    height:58px;
    padding:0 18px;
    background:linear-gradient(180deg, rgba(38,22,31,.97), rgba(27,16,24,.96));
    border-bottom:1px solid rgba(246,198,103,.28);
    box-shadow:0 10px 26px -14px rgba(0,0,0,.85);
  }
  .brand{ font-family:"Caveat", cursive; font-size:1.65rem; color:var(--gold); white-space:nowrap; text-decoration:none; padding-right:6px; }
  .tabs{ display:flex; flex:1; min-width:0; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    position:relative; flex:none;
    height:58px; padding:0 16px;
    display:flex; align-items:center;
    color:#d6bfb4; font-size:.95rem; text-decoration:none; white-space:nowrap;
    transition:color .25s ease;
  }
  .tab::after{
    content:""; position:absolute; left:12px; right:12px; bottom:0;
    height:3px; border-radius:3px 3px 0 0;
    background:var(--gold);
    transform:scaleX(0);
    transition:transform .3s ease;
  }
  .tab:hover{ color:#fff; }
  .tab[aria-current="page"]{ color:#fff6ea; font-weight:600; }
  .tab[aria-current="page"]::after{ transform:scaleX(1); }
  .tab.back{ margin-left:auto; color:#b99aa8; }
  .tab.back .sh{ display:none; }

  .view{ display:none; }
  .view.active{ display:block; animation:viewIn .5s ease; }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(10px); } }

  /* ---------- seccion de introduccion (antes de la pared) ---------- */
  .intro{
    min-height:calc(100vh - 58px);
    min-height:calc(100svh - 58px);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:26px 14px 18px;
    text-align:center;
  }
  .intro .rope{ width:100%; max-width:880px; margin-bottom:6px; }
  .intro .wire path{ stroke:#3c4d39; }
  .intro .cinema{
    width:min(100%, 760px);
    animation:lower 1.3s cubic-bezier(.2,.7,.2,1) .5s backwards;     /* el "telon" baja desde las luces */
  }
  @keyframes lower{
    from{ clip-path:inset(0 0 100% 0); opacity:.2; }
    to  { clip-path:inset(0 0 0 0); opacity:1; }
  }
  .cue{
    margin-top:26px;
    background:none; border:0; padding:6px 12px;
    font-family:"Caveat", cursive;
    font-size:1.55rem;
    color:#f3d9c4;
    cursor:pointer;
    animation:bob 2.2s ease-in-out infinite;
    transition:color .4s ease, text-shadow .4s ease;
  }
  .cue.hot{ color:var(--gold); text-shadow:0 0 18px rgba(246,198,103,.8); }
  @keyframes bob{ 50%{ transform:translateY(7px); } }

  /* ---------- letrero de pizarra ---------- */
  .signwrap{ position:relative; z-index:3; padding:34px 16px 0; }
  .sign{
    max-width:560px;
    margin:0 auto;
    padding:22px 18px 20px;
    text-align:center;
    background:
      radial-gradient(90% 80% at 25% 15%, rgba(255,255,255,.07), transparent 60%),
      radial-gradient(70% 60% at 85% 90%, rgba(255,255,255,.04), transparent 60%),
      #222221;
    border:12px solid;
    border-color:var(--wood-edge);
    border-radius:4px;
    box-shadow:0 22px 40px -14px rgba(0,0,0,.85), inset 0 0 0 2px rgba(0,0,0,.4), inset 0 0 46px rgba(0,0,0,.55);
  }
  .sign .l1{ font-size:1.7rem; margin:0; }
  .sign h1{
    font-family:"Caveat", cursive;
    font-size:clamp(2.5rem, 10vw, 3.9rem);
    font-weight:700;
    line-height:1;
    margin:2px 0 6px;
    letter-spacing:.01em;
  }
  .sign .l3{ font-size:1.5rem; margin:0; color:#eadfce; }

  /* ---------- la pared de tablas ---------- */
  .wall{
    position:relative;
    width:calc(100% - 20px);
    max-width:880px;
    margin:-12px auto 0;
    padding:46px 14px 30px;
    border-radius:6px;
    background:
      linear-gradient(0deg, rgba(0,0,0,.36) 0 3px, transparent 3px) 0 0 / 100% 96px,                     /* juntas entre tablas */
      linear-gradient(0deg, rgba(255,214,160,.08) 0 48px, rgba(0,0,0,.06) 48px 96px) 0 0 / 100% 192px,   /* cada tabla de otro tono */
      repeating-linear-gradient(0deg, rgba(255,235,200,.035) 0 1px, transparent 1px 6px),                /* veta */
      linear-gradient(90deg, #8d5d37, #a5733f 28%, #92623a 55%, #a97745 80%, #8d5d37);
    box-shadow:
      0 34px 70px -24px rgba(0,0,0,.85),
      0 0 90px 10px rgba(255,170,80,.14),
      inset 0 0 70px rgba(0,0,0,.5),
      inset 0 0 0 6px #5b3a1d;
  }

  /* ---------- cuerda con luces ---------- */
  .rope{
    position:relative;
    margin:0 -14px 26px;
  }
  .wire{
    position:absolute; left:0; top:0;
    width:100%;
    overflow:visible;
    pointer-events:none;
  }
  .bulb{
    position:absolute;
    z-index:3;
    width:10px; height:14px;
    margin-left:-5px;
    border-radius:50% 50% 55% 55% / 40% 40% 60% 60%;
    background:radial-gradient(circle at 45% 35%, #fffbe6 0 25%, #ffd978 55%, #f4a93a 100%);
    box-shadow:0 0 6px 2px rgba(255,214,120,.95), 0 0 20px 7px rgba(255,170,70,.5);
    animation:glow var(--d, 3s) ease-in-out infinite alternate;
    pointer-events:none;
  }
  .bulb::before{                                /* casquillo */
    content:"";
    position:absolute; left:50%; top:-4px;
    width:6px; height:5px; margin-left:-3px;
    background:#1d2a1b;
    border-radius:1px;
  }
  @keyframes glow{ from{ opacity:.74; } to{ opacity:1; } }

  .cells{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:repeat(var(--k), minmax(0,1fr));
    align-items:start;
    padding:0 14px;
  }
  .cell{ display:flex; justify-content:center; }

  /* ---------- fotos colgadas con ganchito ---------- */
  .frame{
    position:relative;
    margin:0;
    width:86%;
    max-width:178px;
    background:var(--paper);
    padding:10px 10px 0;
    border-radius:3px;
    box-shadow:0 16px 26px -12px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.06);
    transform-origin:50% 0;
    transform:rotate(var(--r));
    cursor:pointer;
    animation:
      sway calc(5s + var(--i) * .35s) ease-in-out infinite alternate,
      rise .8s cubic-bezier(.2,.7,.2,1) backwards;
    animation-delay:0s, calc(var(--i) * 80ms + 150ms);
  }
  .frame:focus-visible{ outline:3px solid var(--gold); outline-offset:5px; }
  @keyframes sway{
    from{ transform:rotate(calc(var(--r) - 1.3deg)); }
    to  { transform:rotate(calc(var(--r) + 1.3deg)); }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(24px) rotate(var(--r)); }
  }
  .frame::before{                               /* ganchito de madera */
    content:"";
    position:absolute; top:-15px; left:50%;
    width:12px; height:28px;
    margin-left:-6px;
    background:linear-gradient(90deg, #d9aa6e 0 44%, #6e4a26 44% 56%, #d9aa6e 56%);
    border-radius:3px;
    box-shadow:0 2px 4px rgba(0,0,0,.45);
    z-index:4;
  }
  .photo{
    aspect-ratio:4/5;
    background:#e9cdb7;
    border-radius:2px;
    overflow:hidden;
    position:relative;
  }
  .photo img{ width:100%; height:100%; object-fit:cover; display:block; }

  /* hueco vacio, listo para recibir la foto */
  .frame.empty .photo,
  .lb-photo.empty .photo{
    background:
      repeating-linear-gradient(45deg, rgba(58,36,64,.045) 0 10px, transparent 10px 20px),
      linear-gradient(160deg, #f6e3cf, #ecc9b0);
  }
  .ph{
    position:absolute; inset:8px;
    border:1.5px dashed rgba(58,36,64,.3);
    border-radius:3px;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:5px;
    text-align:center;
    color:var(--ink-soft);
  }
  .ph-icon{ font-size:1.9rem; opacity:.55; }
  .ph-text{ font-family:"Caveat", cursive; font-size:1.25rem; }

  figcaption{
    display:flex; align-items:center; gap:8px;
    padding:10px 3px 13px;
    min-height:3.3em;
    font-family:"Caveat", cursive;
    font-size:1.2rem;
    line-height:1.12;
    color:var(--ink);
  }
  .num{
    flex:none;
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid rgba(58,36,64,.3);
    display:flex; align-items:center; justify-content:center;
    font-family:"Fraunces", serif;
    font-size:.74rem;
    color:#b07a2a;
  }
  .soft{ color:var(--ink-soft); opacity:.75; }

  /* ---------- placa de pizarra y marco de video (mi reaccion / introduccion) ---------- */
  .reaction{ text-align:center; padding:6px 0 10px; }
  .plate{
    display:inline-block;
    padding:6px 26px 10px;
    margin:6px 0 20px;
    background:#242423;
    border:6px solid;
    border-color:var(--wood-edge);
    border-radius:5px;
    box-shadow:0 12px 22px -10px rgba(0,0,0,.8), inset 0 0 22px rgba(0,0,0,.5);
    position:relative;
    z-index:4;
  }
  .plate .e{ font-size:1.25rem; color:#f2d9a0; margin:0; }
  .plate h2{ font-family:"Caveat", cursive; font-size:2.2rem; font-weight:700; line-height:1.05; }

  .cinema{
    --ratio:1.7778;
    position:relative;
    margin:0 auto;
    width:min(100%, 720px);
    background:#0c0710;
    border:10px solid;
    border-color:var(--wood-edge);
    border-radius:5px;
    box-shadow:0 24px 44px -18px rgba(0,0,0,.85), inset 0 0 0 2px rgba(0,0,0,.45);
    animation:rise .9s cubic-bezier(.2,.7,.2,1) .2s backwards;
  }
  .screen{
    aspect-ratio:var(--ratio);
    width:min(100%, calc(70vh * var(--ratio)));
    margin:0 auto;
    overflow:hidden;
    background:#07050b;
    position:relative;
  }
  .screen video{ width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  .cinema.empty .screen{
    background:
      radial-gradient(70% 70% at 50% 40%, rgba(255,154,90,.22), transparent 70%),
      linear-gradient(160deg, #241532, #130b1d);
  }
  .cinema.empty .screen-in{
    position:absolute; inset:10px;
    border:1.5px dashed rgba(255,214,170,.32);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px;
    color:#f3d9c4;
  }
  .playdot{
    flex:none;
    width:76px; height:76px;
    border-radius:50%;
    border:2px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold);
    font-size:1.9rem;
    padding-left:6px;
    box-shadow:0 0 34px rgba(246,198,103,.28);
  }
  .screen-in .ph-text{ font-size:1.45rem; color:#f3d9c4; text-align:center; padding:0 10px; }
  .cinema-cap{
    margin:14px 6px 4px;
    font-family:"Caveat", cursive;
    font-size:1.45rem;
    color:#fff3e4;
    text-shadow:0 2px 10px rgba(0,0,0,.7);
  }

  /* ---------- foto ampliada + comentario que se despliega al lado ---------- */
  .lb{
    position:fixed; inset:0; z-index:100;
    display:flex;
    overflow-y:auto;
    padding:62px 16px 30px;
    background:rgba(10,6,10,.93);
    opacity:0; visibility:hidden;
    transition:opacity .35s ease, visibility 0s linear .35s;
  }
  .lb.show{ opacity:1; visibility:visible; transition:opacity .35s ease; }
  .lb-stage{ margin:auto; display:flex; align-items:center; justify-content:center; }
  .lb-photo{
    position:relative;
    flex:none;
    margin:0;
    width:min(400px, 44vw);
    background:var(--paper);
    padding:14px 14px 0;
    border-radius:4px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.9), 0 0 0 1px rgba(0,0,0,.06);
  }
  .lb-photo figcaption{ font-size:1.5rem; padding:12px 4px 16px; min-height:3.4em; }
  .lb-photo .num{ width:30px; height:30px; font-size:.82rem; }
  .lb-photo .ph-text{ font-size:1.5rem; }
  .lb-photo .ph-icon{ font-size:2.6rem; }
  .lb-fade{ transition:opacity .17s ease; }
  .lb-fade.swap{ opacity:0; }

  /* el comentario: un recuadro que se abre hacia un lado */
  .lb-notewrap{
    display:grid;
    grid-template-columns:0fr;
    transition:grid-template-columns .7s cubic-bezier(.2,.8,.2,1);
  }
  .lb-notewrap.open{ grid-template-columns:1fr; }
  .lb-note{ min-width:0; overflow:hidden; }
  .lb-note-in{
    --w:250px;                                  /* ancho del video: vertical 250, horizontal 400 */
    --ratio:.5625;
    width:calc(var(--w) + 56px);
    margin-left:26px;
    padding:14px 20px 20px;
    background:
      radial-gradient(90% 80% at 25% 10%, rgba(255,255,255,.07), transparent 60%),
      #242423;
    border:8px solid;
    border-color:var(--wood-edge);
    border-radius:5px;
    box-shadow:0 22px 40px -16px rgba(0,0,0,.9), inset 0 0 30px rgba(0,0,0,.5);
  }
  .lb-note-in.wide{ --w:400px; }
  .lb-note-in .e{ font-size:1.25rem; color:#f2d9a0; margin:0 0 8px; }
  .lb-note-in .sig{ font-size:1.3rem; color:#f2d9a0; text-align:right; margin:10px 0 0; }
  .vscreen{
    position:relative;
    width:min(100%, calc(66vh * var(--ratio)));
    aspect-ratio:var(--ratio);
    margin:0 auto;
    overflow:hidden;
    background:#07050b;
    border-radius:3px;
  }
  .vscreen video{ width:100%; height:100%; object-fit:contain; display:block; background:#000; }
  .vscreen.empty{
    background:
      radial-gradient(70% 60% at 50% 40%, rgba(255,154,90,.22), transparent 70%),
      linear-gradient(160deg, #241532, #130b1d);
  }
  .vscreen.empty .screen-in{
    position:absolute; inset:8px;
    border:1.5px dashed rgba(255,214,170,.32);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:12px;
    color:#f3d9c4;
  }
  .vscreen .playdot{ width:60px; height:60px; font-size:1.5rem; padding-left:4px; }
  .vscreen .ph-text{ font-size:1.3rem; color:#f3d9c4; text-align:center; padding:0 10px; line-height:1.1; }

  .lb-close, .lb-nav{
    position:fixed; z-index:5;
    width:44px; height:44px;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.24);
    color:#fff6ea;
    font-size:1.7rem; line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:0 0 3px;
  }
  .lb-close{ top:14px; right:14px; font-size:1.9rem; }
  .lb-nav{ top:50%; margin-top:-22px; }
  .lb-nav.prev{ left:14px; }
  .lb-nav.next{ right:14px; }
  .lb-close:hover, .lb-nav:hover{ background:rgba(255,255,255,.2); }

  /* ---------- seccion de la frase + cancion ---------- */
  .song{
    max-width:980px;
    margin:34px auto 0;
    padding:0 14px;
    text-align:center;
  }
  .song .rope{ margin:0 auto 12px; max-width:880px; }
  .song-row{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:22px;
    align-items:center;
    margin-top:30px;
  }
  .song-row .player{ margin:0; width:auto; }

  /* letra traducida: cada linea aparece sola, al ritmo de la cancion */
  .lyrics{
    height:176px;                               /* fija: la tarjeta no salta cuando cambia la linea */
    padding:14px 22px 18px;
    display:flex; flex-direction:column;
    text-align:left;
    background:rgba(18,10,18,.55);
    border:1px solid rgba(246,198,103,.22);
    border-radius:18px;
    box-shadow:0 18px 40px -20px rgba(0,0,0,.8), 0 0 40px -10px rgba(246,198,103,.12);
    overflow:hidden;
  }
  .ly-head{ display:flex; justify-content:space-between; font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:#c9a98f; }
  .ly-sync{ font-variant-numeric:tabular-nums; color:var(--gold); }
  .ly-stage{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:10px; padding-top:10px; min-height:0; overflow:hidden; }
  .ly-line{ font-family:"Caveat", cursive; font-size:2rem; line-height:1.08; color:#fff3e4; transition:opacity .6s ease, font-size .6s ease, color .6s ease; }
  .ly-line.now{ text-shadow:0 0 20px rgba(246,198,103,.38); animation:lyIn .85s cubic-bezier(.2,.8,.2,1) both; }
  .ly-line.prev{ font-size:1.35rem; opacity:.36; color:#e8d3c4; }
  .ly-line.out{ opacity:0; }
  .ly-line.hint{ font-size:1.35rem; opacity:.45; }
  @keyframes lyIn{
    from{ opacity:0; transform:translateY(18px) scale(.97); filter:blur(8px); letter-spacing:.07em; }
    to  { opacity:1; transform:none; filter:none; letter-spacing:0; }
  }
  .song .wire path{ stroke:#3c4d39; }
  .phrase-board{ max-width:620px; padding:28px 24px 24px; margin-top:22px; }
  .phrase-board{ padding:30px 26px 26px; }
  .phrase-board .e{
    font-family:"Cormorant Garamond", "Times New Roman", serif;
    font-style:italic; font-weight:500;
    font-size:1.35rem; letter-spacing:.06em;
    color:#f2d9a0; margin:0 0 14px;
    text-shadow:none;
  }
  .phrase-board .e::after{                      /* filete dorado */
    content:""; display:block;
    width:64px; height:1px; margin:12px auto 0;
    background:linear-gradient(90deg, transparent, #f2d9a0, transparent);
  }
  .phrase-board .q{
    font-family:"Cormorant Garamond", "Times New Roman", serif;
    font-weight:600;
    font-size:clamp(1.5rem, 5.4vw, 2.5rem);
    letter-spacing:.14em;
    line-height:1.4;
    text-transform:uppercase;
    text-wrap:balance;                          /* renglones parejos, sin una palabra suelta */
    color:#fbf1e2;
    text-shadow:0 0 22px rgba(246,198,103,.22);
    margin:0;
    white-space:pre-line;
  }
  .phrase-board .q.dim{ opacity:.5; }
  .phrase-board .sig{
    font-family:"Cormorant Garamond", "Times New Roman", serif;
    font-style:italic; font-weight:500;
    font-size:1.45rem; letter-spacing:.04em;
    color:#f2d9a0; text-align:right; margin:16px 0 0;
    text-shadow:none;
  }

  .player{
    display:flex; align-items:center; gap:18px;
    width:min(100%, 520px);
    margin:30px auto 0;
    padding:16px 20px 16px 16px;
    background:rgba(18,10,18,.55);
    border:1px solid rgba(246,198,103,.22);
    border-radius:60px 18px 18px 60px;
    box-shadow:0 18px 40px -20px rgba(0,0,0,.8), 0 0 40px -10px rgba(246,198,103,.12);
    text-align:left;
  }
  .vinyl{
    flex:none;
    position:relative;
    width:84px; height:84px;
    border-radius:50%;
    border:0; padding:0;
    cursor:pointer;
    background:
      radial-gradient(circle, #f6c667 0 11%, #c9344f 11% 30%, transparent 30%),
      repeating-radial-gradient(circle, #151015 0 2px, #231a24 2px 4px),
      #151015;
    box-shadow:0 8px 20px -6px rgba(0,0,0,.8), 0 0 0 3px rgba(255,255,255,.05);
    animation:spin 5s linear infinite paused;
  }
  .vinyl::after{                                /* brillo del disco */
    content:""; position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 20deg, transparent 0 20%, rgba(255,255,255,.12) 25%, transparent 32% 70%, rgba(255,255,255,.1) 75%, transparent 82%);
  }
  .player.on .vinyl{ animation-play-state:running; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .vinyl .ic{
    position:absolute; left:50%; top:50%; z-index:2;
    width:26px; height:26px; margin:-13px 0 0 -13px;
    border-radius:50%;
    background:rgba(20,10,20,.78);
    color:var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-size:.8rem; line-height:1;
    animation:spin 5s linear infinite reverse paused;   /* el icono no gira con el disco */
  }
  .player.on .vinyl .ic{ animation-play-state:running; }
  .vinyl:focus-visible{ outline:3px solid var(--gold); outline-offset:4px; }
  .pinfo{ flex:1; min-width:0; }
  .pinfo .t{ font-family:"Fraunces", serif; font-size:1.05rem; margin:0; color:var(--paper); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pinfo .a{ font-size:.82rem; margin:2px 0 10px; color:#c9a98f; }
  .bar{
    position:relative; height:6px; border-radius:6px;
    background:rgba(255,255,255,.14);
    cursor:pointer;
  }
  .bar i{ position:absolute; left:0; top:0; bottom:0; width:0; border-radius:6px; background:linear-gradient(90deg, var(--coral), var(--gold)); }
  .bar::before{ content:""; position:absolute; inset:-9px 0; }   /* area de toque mas grande */
  .times{ display:flex; justify-content:space-between; margin-top:6px; font-size:.72rem; color:#a98f9c; font-variant-numeric:tabular-nums; }

  /* ---------- pie ---------- */
  footer{ text-align:center; padding:44px 20px 54px; color:#8f7388; font-size:.85rem; }
  footer .script{ display:block; font-size:1.3rem; color:var(--gold); margin-bottom:6px; }
  footer a{ color:#c9a98f; text-decoration:none; border-bottom:1px solid rgba(201,169,143,.4); }
  footer a:hover{ color:var(--gold); border-color:var(--gold); }
  footer .heart{ color:var(--coral); }
  footer p{ margin:16px 0 0; }

  /* ---------- celular ---------- */
  @media (max-width:759px){
    .lb{ padding:60px 16px 74px; }
    .lb-stage{ flex-direction:column; }
    .lb-photo{ width:min(300px, 74vw); padding:12px 12px 0; }
    .lb-photo figcaption{ font-size:1.3rem; min-height:3em; }
    .lb-notewrap{
      grid-template-columns:1fr;
      grid-template-rows:0fr;
      transition:grid-template-rows .7s cubic-bezier(.2,.8,.2,1);
    }
    .lb-notewrap.open{ grid-template-rows:1fr; }
    .lb-note{ min-height:0; }
    .lb-note-in, .lb-note-in.wide{ --w:min(250px, 62vw); width:calc(var(--w) + 44px); margin:20px auto 0; padding:12px 14px 16px; }
    .lb-note-in.wide{ --w:min(300px, 74vw); }
    .lb-nav{ top:auto; bottom:16px; margin-top:0; width:42px; height:42px; }
    .lb-nav.prev{ left:18px; }
    .lb-nav.next{ right:18px; }
  }
  @media (max-width:759px){
    .song-row{ grid-template-columns:1fr; }
  }
  @media (max-width:599px){
    .topnav{ padding:0 8px; gap:6px; }
    .brand{ display:none; }
    .tab{ padding:0 12px; font-size:.9rem; }

  @media (prefers-reduced-motion: reduce){
    .frame, .cinema, .bulb, .cue, .intro .cinema, .vinyl, .vinyl .ic, .view.active, .ly-line.now{ animation:none; }
    .lb-notewrap{ transition:none; }

</style>
</head>
<body>

<div class="view" id="v-cancion">

  <div class="sign phrase-board">

<!-- foto ampliada + comentario -->
<div class="lb" id="lb" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Foto ampliada">
  <button class="lb-close" id="lb-close" type="button" aria-label="Cerrar">×</button>

      <div class="lb-note"><div class="lb-note-in lb-fade" id="lb-note-in"></div></div>
    </div>

<script>
/* =====================================================================
   ✏️  CÓMO LLENAR ESTA PÁGINA
   -----------------------------------------------------------------
   INTRO    → el video de introducción (la primera sección):
               video   → ruta del video (ej. "media/fotos/intro.mp4")
               poster  → imagen de portada (opcional)
               eyebrow / title / caption → los textos de la sección
   SIGN     → los textos del letrero de pizarra sobre la pared de fotos.
   PHOTOS   → las 10 fotos. Cada una tiene:
               src     → ruta de la foto (ej. "media/fotos/01.jpg").
                         Déjalo vacío "" y se ve el hueco con su marco.
               caption → texto chiquito debajo de la foto (opcional)
               video   → TU comentario en video (ej. "media/fotos/01.mp4"):
                         al tocar la foto se despliega al lado de la foto
                         ampliada y se reproduce solo.
               poster  → imagen de portada del video (opcional)
   Los videos se ajustan solos a horizontal o vertical.
   Mándame las fotos y los videos y yo los pongo aquí.
   ===================================================================== */

const INTRO = {
  eyebrow: "antes de empezar",
  title: "Mira esto primero",
  video: "media/fotos/intro.mp4",
  poster: "",
  caption: ""
};

/* la frase y la cancion que suena en esa seccion */
const PHRASE = {
  eyebrow: "para ti",
  text: "NO QUIERO APRENDER A AMAR A ALGUIEN MÁS",   /* ← tu frase (con \n haces salto de línea) */
  sign: "— Marcelo"
};
/* LETRA TRADUCIDA que aparece al lado del reproductor, línea por línea.
   Lo normal es NO tocar esto: la letra se carga sola desde el archivo media/fotos/letra.txt
   (ver más abajo cómo se arma y cómo se sincroniza con ?tapsync=1).
   Si prefieres, también puedes escribir líneas sueltas aquí: { t: "0:18", es: "tu traducción" } */
const LYRICS = [
  /* { t: "0:00", es: "" }, */
];

const SONG = {
  src: "media/fotos/beautiful.mp3",
  title: "Beautiful",
  artist: "Anyma, Joji"
};

const SIGN = {
  line1: "para ti, Cami",
  title: "Nuestros momentos",
  line3: "diez recuerdos que quería que vieras"
};

const PHOTOS = [
  { src: "", caption: "", video: "", poster: "" },
  { src: "", caption: "", video: "", poster: "" },
  { src: "", caption: "", video: "", poster: "" },
  { src: "", caption: "", video: "", poster: "" },
  { src: "", caption: "", video: "", poster: "" },
  { src: "", caption: "", video: "", poster: "" },
  { src: "", caption: "", video: "", poster: "" },
  { src: "", caption: "", video: "", poster: "" },
  { src: "", caption: "", video: "", poster: "" },
  { src: "", caption: "", video: "", poster: "" }
];

/* ------------------------- render (no tocar) ------------------------- */
document.getElementById("sign-1").textContent = SIGN.line1;
document.getElementById("sign-title").textContent = SIGN.title;
document.getElementById("sign-3").textContent = SIGN.line3;

const ROT = [-2.4, 1.8, -1.2, 2.6, -2, 1.2, -2.8, 2.1, -1.5, 2.4];
const SAG = 34;                                   /* cuanto cuelga la cuerda en el centro (px) */
const wireY = (t) => 3 + 4 * SAG * t * (1 - t);   /* altura de la cuerda en la posicion t (0-1) */

/* ---------- foto ampliada con comentario ---------- */
const lb = document.getElementById("lb");
const lbStage = document.getElementById("lb-stage");
const lbPhoto = document.getElementById("lb-photo");
const lbIn = document.getElementById("lb-in");
const lbNoteWrap = document.getElementById("lb-notewrap");
const lbNoteIn = document.getElementById("lb-note-in");
let lbIndex = -1, lbThumb = null, lbTimer = null;
let frameEls = [];

function frameInner(p, i){
  const n = String(i + 1).padStart(2, "0");
  return `
    <div class="photo">
      ${p.src
        ? `<img src="${p.src}" alt="${p.caption || "recuerdo " + n}" loading="lazy">`
        : `<div class="ph"><span class="ph-icon">📷</span><span class="ph-text">tu foto aquí</span></div>`}
    </div>
    <figcaption>
      <span class="num">${n}</span>
      ${p.caption ? `<span>${p.caption}</span>` : `<span class="soft">aquí va el recuerdo</span>`}
    </figcaption>`;
}

function lbFill(i){
  const p = PHOTOS[i];
  lbPhoto.classList.toggle("empty", !p.src);
  lbIn.innerHTML = frameInner(p, i);
  lbNoteIn.classList.remove("wide");
  lbNoteIn.style.setProperty("--ratio", ".5625");
  lbNoteIn.innerHTML = `
    <p class="chalk e">mi comentario</p>
    <div class="vscreen${p.video ? "" : " empty"}">
      ${p.video
        ? `<video controls playsinline preload="metadata" poster="${p.poster || ""}">
             <source src="${p.video}" type="video/mp4">
           </video>`
        : `<div class="screen-in">
             <div class="playdot">▶</div>
             <span class="ph-text">aquí va mi video comentario</span>
           </div>`}
    </div>
    <p class="chalk sig">— Marcelo</p>`;

  /* el recuadro se adapta a video vertical u horizontal segun el archivo real */
  const v = lbNoteIn.querySelector("video");
  if (v) {
    const fit = () => {
      if (!v.videoWidth || !v.videoHeight) return;
      const r = v.videoWidth / v.videoHeight;
      lbNoteIn.style.setProperty("--ratio", r);
      lbNoteIn.classList.toggle("wide", r >= 1);
    };
    v.addEventListener("loadedmetadata", fit);
    fit();
  }
}

/* reproduce el video comentario de la foto abierta (tocar la foto cuenta como permiso para sonar) */
function lbPlay(){
  const v = lbNoteIn.querySelector("video");
  if (v) { const pr = v.play(); if (pr && pr.catch) pr.catch(() => {}); }
}
function lbStop(){
  lbNoteIn.querySelectorAll("video").forEach(v => { v.pause(); });
}

function openLightbox(i){
  const thumb = frameEls[i];
  if (!thumb) return;
  clearTimeout(lbTimer);
  lbIndex = i;
  lbThumb = thumb;
  lbFill(i);
  lbNoteWrap.classList.remove("open");
  lb.classList.add("show");
  lb.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";

  /* la foto "se despega" de la pared: arranca del tamano y lugar de la miniatura y crece al centro */
  lbPhoto.style.transition = "none";
  lbPhoto.style.transform = "none";
  const t = thumb.getBoundingClientRect();
  const f = lbPhoto.getBoundingClientRect();
  const dx = (t.left + t.width / 2) - (f.left + f.width / 2);
  const dy = (t.top + t.height / 2) - (f.top + f.height / 2);
  const s = thumb.offsetWidth / f.width;
  lbPhoto.style.transform = `translate(${dx}px, ${dy}px) scale(${s}) rotate(${ROT[i % ROT.length]}deg)`;
  thumb.style.visibility = "hidden";
  void lbPhoto.offsetWidth;
  lbPhoto.style.transition = "transform .62s cubic-bezier(.2,.8,.2,1)";
  lbPhoto.style.transform = "none";

  /* y cuando ya esta grande, se despliega el comentario al lado */
  lbTimer = setTimeout(() => { lbNoteWrap.classList.add("open"); lbPlay(); }, 430);
}

function closeLightbox(){
  if (!lb.classList.contains("show")) return;
  clearTimeout(lbTimer);
  lbStop();
  lbNoteWrap.classList.remove("open");
  lbPhoto.style.transition = "transform .3s ease";
  lbPhoto.style.transform = "scale(.9)";
  lb.classList.remove("show");
  lb.setAttribute("aria-hidden", "true");
  if (lbThumb) lbThumb.style.visibility = "";
  document.body.style.overflow = "";
  lbIndex = -1;
  lbThumb = null;
}

function lbGo(j){
  const n = PHOTOS.length;
  j = (j + n) % n;
  if (lbIndex < 0 || j === lbIndex || !frameEls[j]) return;
  if (lbThumb) lbThumb.style.visibility = "";
  lbIndex = j;
  lbThumb = frameEls[j];
  lbThumb.style.visibility = "hidden";
  lbStop();
  const fades = lb.querySelectorAll(".lb-fade");
  fades.forEach(el => el.classList.add("swap"));
  setTimeout(() => {
    lbFill(j);
    fades.forEach(el => el.classList.remove("swap"));
    if (lbNoteWrap.classList.contains("open")) lbPlay();
  }, 170);
}

document.getElementById("lb-close").addEventListener("click", closeLightbox);
document.getElementById("lb-prev").addEventListener("click", () => lbGo(lbIndex - 1));
document.getElementById("lb-next").addEventListener("click", () => lbGo(lbIndex + 1));
lb.addEventListener("click", (e) => { if (e.target === lb || e.target === lbStage) closeLightbox(); });
document.addEventListener("keydown", (e) => {
  if (!lb.classList.contains("show")) return;
  if (e.key === "Escape") closeLightbox();
  else if (e.key === "ArrowLeft") lbGo(lbIndex - 1);
  else if (e.key === "ArrowRight") lbGo(lbIndex + 1);
});

/* ---------- la pared ---------- */
function makeFrame(p, i){
  const n = String(i + 1).padStart(2, "0");
  const fig = document.createElement("figure");
  fig.className = "frame" + (p.src ? "" : " empty");
  fig.style.setProperty("--r", ROT[i % ROT.length] + "deg");
  fig.style.setProperty("--i", i);
  fig.tabIndex = 0;
  fig.setAttribute("role", "button");
  fig.setAttribute("aria-label", "Ver la foto " + n + " y mi comentario");
  fig.innerHTML = frameInner(p, i);
  fig.addEventListener("click", () => openLightbox(i));
  fig.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLightbox(i); }
  });
  return fig;
}

/* una cuerda con luces; si trae fotos, quedan colgadas de ella */
function makeRope(slice, K, startIndex){
  const row = document.createElement("div");
  row.className = "rope";
  row.style.setProperty("--k", K);
  row.style.minHeight = (SAG + 12) + "px";

  const bulbsN = K >= 5 ? 24 : 9;
  let bulbs = "";
  for (let b = 0; b < bulbsN; b++) {
    const t = (b + 0.5) / bulbsN;
    bulbs += `<i class="bulb" style="left:${(t * 100).toFixed(2)}%;top:${(wireY(t) + 2).toFixed(1)}px;--d:${(2.2 + ((b * 37) % 17) / 10).toFixed(1)}s;animation-delay:${(((b * 53) % 20) / 10).toFixed(1)}s"></i>`;
  }
  row.innerHTML = `
    <svg class="wire" viewBox="0 0 100 ${SAG + 8}" preserveAspectRatio="none" style="height:${SAG + 8}px" aria-hidden="true">
      <path d="M0,3 Q50,${3 + 2 * SAG} 100,3" fill="none" stroke="#1d2a1b" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
    </svg>
    ${bulbs}
  `;

  if (slice.length) {
    const cells = document.createElement("div");
    cells.className = "cells";
    slice.forEach((p, j) => {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.marginTop = wireY((j + 0.5) / K).toFixed(1) + "px";
      cell.appendChild(makeFrame(p, startIndex + j));
      cells.appendChild(cell);
    });
    row.appendChild(cells);
  }
  return row;
}

/* celular: 2 fotos por cuerda; pantalla grande: 5 por cuerda */
const bigScreen = window.matchMedia("(min-width:900px)");
function buildRows(){
  closeLightbox();
  const K = bigScreen.matches ? 5 : 2;
  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  for (let s = 0; s < PHOTOS.length; s += K) {
    rows.appendChild(makeRope(PHOTOS.slice(s, s + K), K, s));
  }
  frameEls = [...rows.querySelectorAll(".frame")];
}
buildRows();
if (bigScreen.addEventListener) bigScreen.addEventListener("change", buildRows);
else bigScreen.addListener(buildRows);

/* ---------- secciones de video: luces arriba, placa de pizarra y marco de madera ---------- */
function mountVideo(el, cfg, emptyLabel){
  el.innerHTML = `
    <div class="plate">
      <p class="chalk e">${cfg.eyebrow}</p>
      <h2 class="chalk">${cfg.title}</h2>
    </div>
    <div class="cinema${cfg.video ? "" : " empty"}">
      <div class="screen">
        ${cfg.video
          ? `<video controls playsinline preload="metadata" poster="${cfg.poster || ""}">
               <source src="${cfg.video}" type="video/mp4">
             </video>`
          : `<div class="screen-in">
               <div class="playdot">▶</div>
               <span class="ph-text">${emptyLabel}</span>
             </div>`}
      </div>
    </div>
    ${cfg.caption ? `<p class="cinema-cap">${cfg.caption}</p>` : ""}
  `;
  el.prepend(makeRope([], 1, 0));

  /* el marco se adapta a horizontal o vertical segun el archivo real */
  const v = el.querySelector("video");
  if (v) {
    v.addEventListener("loadedmetadata", () => {
      if (v.videoWidth && v.videoHeight) {
        el.querySelector(".cinema").style.setProperty("--ratio", v.videoWidth / v.videoHeight);
      }
    });
  }
  return v;
}

const introVideo = mountVideo(document.getElementById("intro-body"), INTRO, "aquí va el video de introducción");

/* ---------- frase + cancion ---------- */
document.getElementById("phrase-eyebrow").textContent = PHRASE.eyebrow;
const phraseEl = document.getElementById("phrase-text");
phraseEl.textContent = PHRASE.text || "aquí va tu frase";
phraseEl.classList.toggle("dim", !PHRASE.text);
document.getElementById("phrase-sig").textContent = PHRASE.sign;
document.getElementById("song-title").textContent = SONG.title;
document.getElementById("song-artist").textContent = SONG.artist;
document.getElementById("song").prepend(makeRope([], 1, 0));

const audio = document.getElementById("song-audio");
const player = document.getElementById("player");
const vinyl = document.getElementById("vinyl");
const vinylIc = document.getElementById("vinyl-ic");
const bar = document.getElementById("bar");
const barFill = document.getElementById("bar-fill");
audio.src = SONG.src;
const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
let userPaused = false, autoStarted = false;

function paintAudio(){
  const d = audio.duration || 0;
  const p = d ? audio.currentTime / d : 0;
  barFill.style.width = (p * 100).toFixed(2) + "%";
  bar.setAttribute("aria-valuenow", Math.round(p * 100));
  document.getElementById("t-cur").textContent = fmt(audio.currentTime);
  document.getElementById("t-dur").textContent = fmt(d);
}
audio.addEventListener("timeupdate", paintAudio);
audio.addEventListener("loadedmetadata", paintAudio);
audio.addEventListener("play", () => { player.classList.add("on"); vinylIc.textContent = "❚❚"; vinyl.setAttribute("aria-label", "Pausar canción"); });
audio.addEventListener("pause", () => { player.classList.remove("on"); vinylIc.textContent = "▶"; vinyl.setAttribute("aria-label", "Reproducir canción"); });

vinyl.addEventListener("click", () => {
  if (audio.paused) { userPaused = false; autoStarted = false; audio.play().catch(() => {}); }
  else { userPaused = true; audio.pause(); }
});
function seekTo(clientX){
  const r = bar.getBoundingClientRect();
  if (audio.duration) audio.currentTime = Math.min(1, Math.max(0, (clientX - r.left) / r.width)) * audio.duration;
}
bar.addEventListener("click", (e) => seekTo(e.clientX));
bar.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5);
  else if (e.key === "ArrowLeft") audio.currentTime = Math.max(0, audio.currentTime - 5);
});

/* solo suena una cosa a la vez: si empieza un video o la cancion, lo demas se pausa */
document.addEventListener("play", (e) => {
  document.querySelectorAll("video, audio").forEach(m => { if (m !== e.target && !m.paused) m.pause(); });
}, true);

/* ---------- letra traducida: cada linea aparece sola en su minuto ---------- */
const lyStage = document.getElementById("ly-stage");
let lyLines = [], lyIdx = -2, lyStale = false;
const LY_HOLD = 8;                          /* segundos que una linea se queda en pantalla si no entra otra */
/* LY_OFFSET: cuantos segundos ANTES aparece cada linea respecto a su tiempo (compensa el retraso al marcar).
   Si la letra sale tarde, sube este numero; si sale antes de tiempo, bájalo.
   Para probar sin editar: fotos.html?lyoffset=1.2#cancion */
const _lo = parseFloat(new URLSearchParams(location.search).get("lyoffset"));
let LY_OFFSET = isFinite(_lo) ? _lo : 2.8;
const lyTime = (t) => {
  if (typeof t === "number") return t;
  const parts = String(t).trim().split(":").map(parseFloat);
  return parts.reduce((acc, n) => acc * 60 + (n || 0), 0);
};
function lyricsInit(){
  lyLines = LYRICS.filter(l => l && l.es).map(l => ({ t: lyTime(l.t), es: l.es })).sort((a, b) => a.t - b.t);
  lyIdx = -2;
  lyStale = false;
  lyUpdate();
}
function lyEl(text, cls){
  const d = document.createElement("div");
  d.className = "ly-line " + cls;
  d.textContent = text;
  return d;
}
function lyUpdate(){
  if (!lyLines.length) {
    if (lyIdx !== -3) {
      lyStage.innerHTML = "";
      lyStage.appendChild(lyEl("aquí aparecerá la letra traducida, línea por línea, mientras suena la canción", "hint"));
      lyIdx = -3;
    }
    return;
  }
  const now = audio.currentTime + LY_OFFSET;
  let idx = -1;
  for (let i = 0; i < lyLines.length; i++) { if (lyLines[i].t <= now) idx = i; else break; }
  /* si pasan muchos segundos sin linea nueva (parte instrumental), la letra se desvanece sola */
  const stale = idx >= 0 && now - lyLines[idx].t > LY_HOLD;
  if (idx === lyIdx) {
    if (stale && !lyStale) {
      lyStage.querySelectorAll(".ly-line").forEach(el => { el.classList.add("out"); setTimeout(() => el.remove(), 900); });
      lyStale = true;
    }
    return;
  }
  lyStale = stale;
  if (stale) { lyStage.innerHTML = ""; lyIdx = idx; return; }

  if (idx === lyIdx + 1 && idx >= 0 && lyIdx >= -1) {
    /* sigue la linea siguiente: la actual se atenua y la nueva aparece */
    [...lyStage.querySelectorAll(".prev")].forEach(el => { el.classList.add("out"); setTimeout(() => el.remove(), 650); });
    const cur = lyStage.querySelector(".now");
    if (cur) { cur.classList.remove("now"); cur.classList.add("prev"); }
    lyStage.appendChild(lyEl(lyLines[idx].es, "now"));
  } else {
    /* salto (adelantar, retroceder, empezar de nuevo): se rearma sin vuelo */
    lyStage.innerHTML = "";
    if (idx >= 1) lyStage.appendChild(lyEl(lyLines[idx - 1].es, "prev"));
    if (idx >= 0) lyStage.appendChild(lyEl(lyLines[idx].es, "now"));
  }
  lyIdx = idx;
}
audio.addEventListener("timeupdate", lyUpdate);
audio.addEventListener("seeked", lyUpdate);
/* ?ajustar=1 → botones − / + en el recuadro de la letra para adelantarla o atrasarla mientras suena */
if (new URLSearchParams(location.search).get("ajustar") === "1") {
  const head = document.querySelector("#lyrics .ly-head");
  const wrap = document.createElement("span");
  wrap.style.cssText = "display:flex;align-items:center;gap:6px;letter-spacing:0;text-transform:none";
  wrap.innerHTML = `<button type="button" id="lo-minus">−</button><b id="lo-val" style="min-width:5.2em;text-align:center;color:#f6c667"></b><button type="button" id="lo-plus">+</button>`;
  head.appendChild(wrap);
  wrap.querySelectorAll("button").forEach(b => { b.style.cssText = "font:inherit;font-size:1rem;width:30px;height:28px;border-radius:8px;border:1px solid rgba(246,198,103,.5);background:rgba(255,255,255,.08);color:#fff3e4;cursor:pointer"; });
  const paintLo = () => { document.getElementById("lo-val").textContent = "adelanto " + LY_OFFSET.toFixed(1) + " s"; };
  const bump = (d) => { LY_OFFSET = Math.max(0, Math.round((LY_OFFSET + d) * 10) / 10); lyIdx = -2; lyStale = false; lyUpdate(); paintLo(); };
  document.getElementById("lo-minus").addEventListener("click", () => bump(-0.2));
  document.getElementById("lo-plus").addEventListener("click", () => bump(0.2));
  paintLo();
}
/* mientras suena, se revisa en cada cuadro de pantalla (timeupdate solo avisa ~4 veces por segundo) */
let lyRaf = 0;
const lyLoop = () => { lyUpdate(); lyRaf = audio.paused ? 0 : requestAnimationFrame(lyLoop); };
audio.addEventListener("play", () => { if (!lyRaf) lyRaf = requestAnimationFrame(lyLoop); });

/* ?sync=1 → muestra el tiempo exacto de la cancion para anotar en que segundo entra cada linea */
if (new URLSearchParams(location.search).get("sync") === "1") {
  const syncEl = document.getElementById("ly-sync");
  const tick = () => {
    const t = audio.currentTime;
    syncEl.textContent = "⏱ " + Math.floor(t / 60) + ":" + (t % 60).toFixed(1).padStart(4, "0");
    requestAnimationFrame(tick);
  };
  tick();
}
lyricsInit();

/* ---------- la letra vive en un archivo aparte: media/fotos/letra.txt ----------
   Formato: bloques separados por una linea en blanco. En cada bloque, la 1.ª linea es la traduccion
   (la que se muestra) y la 2.ª (opcional) el original. La traduccion puede empezar con su tiempo:
       [0:18] Me haces sentir vivo otra vez
   Las lineas sin tiempo no se muestran. El modo sincronizar (?tapsync=1) agrega los tiempos solo. */
const LETRA_URL = "media/fotos/letra.txt";
function parseLetra(txt){
  return txt.replace(/^﻿/, "").replace(/\r/g, "").split(/\n\s*\n/)
    .map(b => b.split("\n").map(s => s.trim()).filter(Boolean))
    .filter(b => b.length)
    .map(b => {
      let es = b[0], t = null;
      const m = es.match(/^\[(\d+:\d+(?:\.\d+)?)\]\s*(.*)$/);
      if (m) { t = m[1]; es = m[2]; }
      return { t, es, en: b[1] || "" };
    });
}
let letraBlocks = [];
const letraReady = fetch(LETRA_URL, { cache: "no-cache" })
  .then(r => r.ok ? r.text() : "")
  .then(txt => {
    letraBlocks = parseLetra(txt);
    letraBlocks.filter(b => b.t !== null && b.es).forEach(b => LYRICS.push({ t: b.t, es: b.es }));
    lyricsInit();
  })
  .catch(() => {});

/* ---------- modo sincronizar: ?tapsync=1 ----------
   Reproduce la cancion y toca "Ahora" (o Espacio) justo cuando entra cada linea.
   Al final descarga letra.txt ya con los tiempos; reemplaza el de media/fotos/. */
const TAPSYNC = new URLSearchParams(location.search).get("tapsync") === "1";
if (TAPSYNC) {
  const REACT = 0.25;                       /* segundos que se restan por el tiempo de reaccion */
  const box = document.createElement("div");
  box.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:60;padding:14px 16px 18px;background:#1b1118;border-top:2px solid #f6c667;color:#fff3e4;font-family:'Work Sans',sans-serif;text-align:center;box-shadow:0 -12px 30px rgba(0,0,0,.6)";
  box.innerHTML = `
    <div id="ts-paste-wrap" style="display:none;margin-bottom:10px">
      <textarea id="ts-paste" rows="5" placeholder="Pega aquí la letra traducida (una traducción por bloque, con su original debajo si quieres) y toca Cargar" style="width:100%;max-width:640px;font:inherit;font-size:.85rem;padding:8px;border-radius:8px;border:1px solid rgba(246,198,103,.5);background:#120a11;color:#fff3e4"></textarea>
      <div><button id="ts-load" type="button" style="margin-top:6px">Cargar letra</button></div>
    </div>
    <div id="ts-info" style="font-size:.78rem;color:#c9a98f;margin-bottom:6px"></div>
    <div id="ts-es" style="font-family:'Caveat',cursive;font-size:1.9rem;line-height:1.1;min-height:2.2em"></div>
    <div id="ts-en" style="font-size:.85rem;color:#a98f9c;min-height:1.3em;margin-bottom:10px"></div>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <button id="ts-play" type="button">▶ canción</button>
      <button id="ts-now" type="button" style="background:#f6c667;color:#2a1b22;font-weight:700;padding:12px 30px">Ahora (Espacio)</button>
      <button id="ts-skip" type="button">Saltar</button>
      <button id="ts-undo" type="button">↶ Deshacer</button>
      <button id="ts-rate" type="button">velocidad 0.75×</button>
      <button id="ts-restart" type="button">⏮ de nuevo</button>
      <button id="ts-dl" type="button">⬇ letra.txt</button>
    </div>`;
  document.body.appendChild(box);
  box.querySelectorAll("button").forEach(b => {
    b.style.cssText += ";font:inherit;font-size:.95rem;padding:10px 16px;border-radius:10px;border:1px solid rgba(246,198,103,.5);background:rgba(255,255,255,.07);color:#fff3e4;cursor:pointer";
  });
  const q = (id) => box.querySelector("#" + id);
  let pos = 0;
  const fmtT = (s) => Math.floor(s / 60) + ":" + (s % 60).toFixed(2).padStart(5, "0");
  q("ts-load").addEventListener("click", () => {
    const blocks = parseLetra(q("ts-paste").value);
    if (!blocks.length) return;
    letraBlocks = blocks; pos = 0;
    paintSync();
  });
  const paintSync = () => {
    const n = letraBlocks.length;
    q("ts-paste-wrap").style.display = n ? "none" : "block";
    q("ts-info").textContent = n
      ? (pos < n ? `línea ${pos + 1} de ${n}  ·  ${fmtT(audio.currentTime)}` : "listo: toca ⬇ letra.txt y avísame para publicarlo")
      : "pega la letra traducida aquí arriba";
    q("ts-es").textContent = pos < n ? letraBlocks[pos].es : (n ? "✓" : "");
    q("ts-en").textContent = pos < n ? letraBlocks[pos].en : "";
  };
  const stamp = () => {
    if (pos >= letraBlocks.length) return;
    letraBlocks[pos].t = fmtT(Math.max(0, audio.currentTime - REACT));
    pos++; paintSync();
  };
  q("ts-now").addEventListener("click", stamp);
  q("ts-skip").addEventListener("click", () => { if (pos < letraBlocks.length) { letraBlocks[pos].t = null; pos++; paintSync(); } });
  q("ts-undo").addEventListener("click", () => { if (pos > 0) { pos--; letraBlocks[pos].t = null; paintSync(); } });
  q("ts-play").addEventListener("click", () => { if (audio.paused) audio.play().catch(() => {}); else audio.pause(); });
  /* a menor velocidad es mas facil tocar justo a tiempo; el tiempo que se guarda es el de la cancion, no el del reloj */
  const RATES = [0.75, 0.5, 1];
  let ri = 0;
  audio.playbackRate = RATES[0];
  q("ts-rate").addEventListener("click", () => {
    ri = (ri + 1) % RATES.length;
    audio.playbackRate = RATES[ri];
    q("ts-rate").textContent = "velocidad " + RATES[ri] + "×";
  });
  q("ts-restart").addEventListener("click", () => {
    if (!confirm("¿Borrar todos los tiempos y empezar de nuevo?")) return;
    letraBlocks.forEach(b => { b.t = null; });
    pos = 0;
    audio.currentTime = 0;
    audio.playbackRate = RATES[ri];
    audio.play().catch(() => {});
    paintSync();
  });
  const playLabel = () => { q("ts-play").textContent = audio.paused ? "▶ canción" : "❚❚ pausar"; };
  audio.addEventListener("play", playLabel);
  audio.addEventListener("pause", playLabel);
  playLabel();
  q("ts-dl").addEventListener("click", () => {
    const out = letraBlocks.map(b => (b.t !== null ? `[${b.t}] ` : "") + b.es + (b.en ? "\n" + b.en : "")).join("\n\n") + "\n";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "text/plain;charset=utf-8" }));
    a.download = "letra.txt";
    document.body.appendChild(a); a.click(); a.remove();
  });
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space" && !(e.target && /^(BUTTON|INPUT|TEXTAREA)$/.test(e.target.tagName))) { e.preventDefault(); stamp(); }
  });
  audio.addEventListener("timeupdate", paintSync);
  letraReady.then(paintSync);
  if (!location.hash) location.hash = "#cancion";
}

/* ---------- pestanas: una seccion a la vez ---------- */
/* ---------- guirnalda de luces del fondo ---------- */
(function fairyLights(){
  const box = document.getElementById("fairy");
  if(!box) return;
  const NS = "http://www.w3.org/2000/svg";
  function draw(){
    const w = Math.max(320, window.innerWidth || 1200);
    const strands = 2;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + w + " 220");
    svg.setAttribute("preserveAspectRatio", "xMidYMin slice");
    svg.innerHTML = '<defs><radialGradient id="fgl"><stop offset="0" stop-color="#ffd48a" stop-opacity=".95"/>' +
      '<stop offset=".35" stop-color="#ffb35c" stop-opacity=".38"/><stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/></radialGradient></defs>';
    for(let s = 0; s < strands; s++){
      const y0 = 58 + s * 40 + (s % 2 ? 10 : 0);
      const sag = 26 + s * 7;
      const x0 = -10, x1 = w + 10;
      const path = document.createElementNS(NS, "path");
      path.setAttribute("class", "wire");
      path.setAttribute("d", "M" + x0 + " " + (y0 - 18) + " Q" + (w / 2) + " " + (y0 + sag * 2) + " " + x1 + " " + (y0 - 18));
      svg.appendChild(path);
      const n = Math.round(w / 64);
      for(let i = 1; i < n; i++){
        const t = i / n;
        const x = (1 - t) * (1 - t) * x0 + 2 * (1 - t) * t * (w / 2) + t * t * x1;
        const y = (1 - t) * (1 - t) * (y0 - 18) + 2 * (1 - t) * t * (y0 + sag * 2) + t * t * (y0 - 18) + 5;
        const g = document.createElementNS(NS, "circle");
        g.setAttribute("class", "glow"); g.setAttribute("cx", x); g.setAttribute("cy", y + 4); g.setAttribute("r", 22);
        g.style.animationDelay = (-((i * 7 + s * 13) % 36) / 10) + "s";
        const c = document.createElementNS(NS, "ellipse");
        c.setAttribute("class", "core"); c.setAttribute("cx", x); c.setAttribute("cy", y + 4); c.setAttribute("rx", 3); c.setAttribute("ry", 4.2);
        svg.appendChild(g); svg.appendChild(c);
      }
    }
    box.innerHTML = ""; box.appendChild(svg);
  }
  draw();
  let tm; window.addEventListener("resize", function(){ clearTimeout(tm); tm = setTimeout(draw, 150); });
})();

const VIEWS = ["intro", "fotos", "cancion"];
const cue = document.getElementById("cue");
if (introVideo) introVideo.addEventListener("ended", () => cue.classList.add("hot"));
let curView = null;

function showView(name){
  if (!VIEWS.includes(name)) name = "intro";
  const prev = curView;
  if (name === prev) return;
  curView = name;
  closeLightbox();
  VIEWS.forEach(v => document.getElementById("v-" + v).classList.toggle("active", v === name));
  document.querySelectorAll(".tab[data-view]").forEach(t => {
    if (t.dataset.view === name) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
  });
  window.scrollTo(0, 0);
  document.title = { intro: "Para ti, Cami", fotos: "Nuestros momentos", cancion: "Una canción para ti" }[name];

  /* el video de la introduccion se pausa al irse de su seccion */
  if (prev === "intro" && introVideo) introVideo.pause();

  /* la cancion intenta sonar sola al entrar a su seccion (si el navegador no la deja, queda el disco);
     si ella la pausa a mano no vuelve a empezar sola; si salio y sonaba sola, se pausa */
  if (name === "cancion") {
    if (!TAPSYNC && !userPaused && audio.paused) audio.play().then(() => { autoStarted = true; }).catch(() => {});
  } else if (autoStarted && !audio.paused) {
    audio.pause();
    autoStarted = false;
  }
}
const fromHash = () => showView(location.hash.replace("#", ""));
window.addEventListener("hashchange", fromHash);
fromHash();
